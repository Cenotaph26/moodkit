<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoodKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ede6;--bg2:#e8e4da;--bg3:#dedad0;
  --card:#ffffff;
  --blk:#1a1a18;--blk2:#2c2c28;
  --amb:#C8720A;--ambL:#FEF3DC;
  --gry:#ede9e0;--gry2:#d8d4ca;--gry3:#b4b0a6;
  --t1:#1a1a18;--t2:#5c5852;--t3:#9c9890;
  --bdr:rgba(26,26,24,.09);--bdr2:rgba(26,26,24,.18);
  --ok-c:#1a5c1a;--ok-bg:rgba(26,92,26,.08);--ok-br:rgba(26,92,26,.18);
  --wt-c:#8a5000;--wt-bg:#FEF3DC;--wt-br:rgba(200,114,10,.22);
  --er-c:#7a1818;--er-bg:rgba(160,30,30,.08);--er-br:rgba(160,30,30,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased}

/* ── SHELL ── */
.app{display:flex;flex-direction:column;height:100vh}
.tb{height:48px;background:var(--card);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0;z-index:10}
.tb-logo{font-size:15px;font-weight:700;letter-spacing:-.4px;color:var(--blk)}
.tb-logo em{font-style:normal;color:var(--amb)}
.tb-sep{width:1px;height:18px;background:var(--bdr2);flex-shrink:0}
.tb-bc{flex:1;display:flex;align-items:center;gap:4px;font-size:12px;overflow:hidden}
.bcr{color:var(--t3);cursor:pointer;white-space:nowrap}
.bcr:hover{color:var(--t1)}
.bcs{color:var(--bdr2)}
.bcu{color:var(--t1);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-av{width:28px;height:28px;border-radius:50%;background:var(--blk);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;cursor:pointer}
.tb-nm{font-size:11px;color:var(--t2)}

.layout{display:flex;flex:1;overflow:hidden;min-height:0}
.sb{width:196px;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;padding:10px 0 12px}
.cnt{flex:1;overflow-y:auto;padding:20px 22px;background:var(--bg);min-height:0}
.page{display:none}.page.on{display:block}

/* ── SIDEBAR ── */
.sb-lbl{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;padding:10px 14px 4px;display:block}
.sb-nav{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;margin:0 6px 1px;cursor:pointer;font-size:12px;color:var(--t2);transition:background .1s,color .1s;white-space:nowrap;user-select:none}
.sb-nav:hover{background:var(--gry);color:var(--t1)}
.sb-nav.on{background:var(--blk);color:#fff;font-weight:500}
.sb-nav svg{flex-shrink:0;opacity:.5}
.sb-nav.on svg{opacity:1}
.sb-hr{height:1px;background:var(--bdr);margin:8px 12px}
.firm-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:8px;margin:0 6px 1px;cursor:pointer;font-size:12px;font-weight:500;color:var(--t1);transition:background .1s;user-select:none}
.firm-row:hover{background:var(--gry)}
.firm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:6px}
.firm-count{font-size:10px;font-weight:400;color:var(--t3)}
.sub-link{display:block;padding:5px 10px 5px 22px;border-radius:8px;margin:0 6px 1px;font-size:11px;color:var(--t3);cursor:pointer;transition:background .1s,color .1s;user-select:none}
.sub-link:hover{background:var(--gry);color:var(--t2)}
.sub-link.on{color:var(--t1);font-weight:500}
.sub-link.on::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--t1);margin-right:6px;vertical-align:middle;margin-bottom:1px}
.sb-add{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;margin:4px 6px 0;font-size:12px;color:var(--amb);cursor:pointer;transition:background .1s}
.sb-add:hover{background:var(--ambL)}
.sb-subs{overflow:hidden}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:'Inter',system-ui;cursor:pointer;font-weight:500;letter-spacing:-.1px;transition:all .12s;white-space:nowrap;border:none;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--blk);color:#fff;border-radius:999px;padding:0 16px;height:34px;font-size:12px}
.btn.solid:hover{background:var(--blk2)}
.btn.amber{background:var(--amb);color:#fff;border-radius:999px;padding:0 16px;height:34px;font-size:12px}
.btn.amber:hover{background:#a85d08}
.btn.outline{background:var(--card);color:var(--blk);border:1.5px solid var(--bdr2);border-radius:999px;padding:0 14px;height:34px;font-size:12px}
.btn.outline:hover{background:var(--gry)}
.btn.surface{background:var(--gry2);color:var(--blk);border-radius:999px;padding:0 14px;height:34px;font-size:12px}
.btn.surface:hover{background:var(--gry3)}
.btn.out-a{background:var(--card);color:var(--amb);border:1.5px solid var(--amb);border-radius:999px;padding:0 14px;height:34px;font-size:12px}
.btn.out-a:hover{background:var(--ambL)}
.btn.sm{height:28px;padding:0 12px;font-size:11px}
.btn.xs{height:22px;padding:0 9px;font-size:10px}
.btn.lg{height:40px;padding:0 20px;font-size:13px}
.btn.ico{border-radius:50%;padding:0}
.btn.ico.md{width:34px;height:34px}
.btn.ico.sm{width:28px;height:28px}
.btn.ico.xs{width:22px;height:22px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-c);border:.5px solid var(--ok-br)}
.b-rv{background:#e0ddd6;color:#3a3832;border:.5px solid #c4c0b8}
.b-wt{background:var(--wt-bg);color:var(--wt-c);border:.5px solid var(--wt-br)}
.b-er{background:var(--er-bg);color:var(--er-c);border:.5px solid var(--er-br)}
.b-blk{background:var(--blk);color:#fff}
.b-amb{background:var(--ambL);color:#7a4000;border:.5px solid var(--wt-br)}
.b-gry{background:#c8c4bc;color:#2a2a24;border:.5px solid #a8a49c}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:500;cursor:pointer;transition:all .1s}
.tag.filled{background:var(--blk);color:#fff}
.tag.ot{background:var(--card);color:var(--t1);border:1.5px solid var(--bdr2)}
.tag.ot:hover{background:var(--gry)}
.tag.sf{background:var(--gry2);color:var(--t1)}
.tag.sf:hover{background:var(--gry3)}

/* ── SEGMENTED ── */
.seg{display:inline-flex;background:var(--gry2);border-radius:10px;padding:2px;gap:1px}
.seg-b{padding:4px 11px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;color:var(--t2);border:none;background:transparent;font-family:'Inter',system-ui;transition:all .1s}
.seg-b.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ── FORMS ── */
.fl{font-size:9px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.inp{width:100%;height:36px;padding:0 12px;border:1px solid var(--bdr2);border-radius:10px;font-size:12px;color:var(--t1);background:var(--card);font-family:'Inter',system-ui;outline:none}
.inp:focus{border-color:var(--blk);box-shadow:0 0 0 3px rgba(26,26,24,.06)}
.inp.ta{height:auto;min-height:72px;padding:10px 12px;resize:vertical;border-radius:10px;line-height:1.5}
select.inp{cursor:pointer}
.inp-row{display:flex;align-items:center;gap:7px;padding:0 12px;height:36px;border:1px solid var(--bdr2);border-radius:999px;background:var(--card)}
.inp-row input{border:none;outline:none;flex:1;font-size:12px;color:var(--t1);background:transparent;font-family:'Inter',system-ui}
.inp-row input::placeholder{color:var(--t3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-g{display:flex;flex-direction:column;margin-bottom:10px}

/* ── STAGE PILLS ── */
.stage-nav{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;margin-bottom:18px;scrollbar-width:none}
.stage-nav::-webkit-scrollbar{display:none}
.stage-pill{padding:5px 12px;border-radius:999px;font-size:10px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .12s;user-select:none}
.stage-pill.done{background:var(--ok-bg);color:var(--ok-c);border:.5px solid var(--ok-br)}
.stage-pill.active{background:var(--blk);color:#fff}
.stage-pill.todo{background:var(--gry2);color:var(--t2);border:.5px solid var(--bdr)}
.stage-pill.todo:hover{background:var(--gry3);color:var(--t1)}
.stage-arrow{color:var(--t3);font-size:11px;flex-shrink:0}

/* ── STAT CARD ── */
.stat{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:14px 16px}
.stat-l{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat-v{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.5px;line-height:1}
.stat-c{font-size:10px;margin-top:3px;color:var(--t3)}

/* ── MOODBOARD CARD ── */
.mb-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);overflow:hidden;position:relative;cursor:pointer;transition:border-color .12s,transform .12s}
.mb-card:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.mb-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:1}
.mb-card[data-s="ok"]::before{background:rgba(26,92,26,.55)}
.mb-card[data-s="rv"]::before{background:var(--gry3)}
.mb-card[data-s="wt"]::before{background:var(--amb)}
.mb-card[data-s="er"]::before{background:rgba(160,30,30,.6)}
.mb-card[data-s="er"]{border-color:var(--er-br)}
.mb-ov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .12s;display:flex;align-items:center;justify-content:center;gap:5px;z-index:2}
.mb-card:hover .mb-ov{opacity:1}
.mb-ov-btn{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:none}
.mb-plat{position:absolute;top:6px;left:8px;z-index:2;padding:2px 6px;border-radius:4px;font-size:7px;font-weight:600;color:#fff}
.mb-add{background:var(--card);border-radius:12px;border:1.5px dashed var(--bdr2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:border-color .12s;min-height:120px}
.mb-add:hover{border-color:var(--blk)}

/* ── KANBAN ── */
.kb-col{background:var(--gry);border-radius:12px;padding:10px;min-height:120px}
.kb-ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.kb-t{font-size:12px;font-weight:500;color:var(--t1)}
.tc{background:var(--card);border-radius:10px;border:1px solid var(--bdr);padding:10px 11px;margin-bottom:5px;position:relative;overflow:hidden;cursor:grab;user-select:none}
.tc:hover{border-color:var(--bdr2)}
.tc.drg{opacity:.4;cursor:grabbing}
.tc-acc{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}

/* ── INFO BLOCK ── */
.info{display:flex;gap:9px;padding:10px 12px;border-radius:10px;font-size:11px;line-height:1.55;margin-bottom:12px}
.info.ok{background:var(--ok-bg);color:var(--ok-c)}
.info.wt{background:var(--wt-bg);color:var(--wt-c)}
.info.er{background:var(--er-bg);color:var(--er-c)}
.info-ico{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ── LIST CELL ── */
.cell{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);cursor:pointer;transition:all .1s;margin-bottom:5px}
.cell:hover{background:var(--gry);border-color:var(--bdr2)}

/* ── PROGRESS ── */
.prog{height:2px;background:var(--gry2);border-radius:2px;overflow:hidden;margin:4px 0}
.pf{height:100%;border-radius:2px;background:var(--blk)}

/* ── SKELETON ── */
.skel{background:var(--gry);border-radius:6px;animation:sk 1.4s ease infinite}
@keyframes sk{0%,100%{opacity:.75}50%{opacity:.38}}

/* ── IG CELLS ── */
.igcell{border-radius:8px;overflow:hidden;position:relative;cursor:pointer;background:var(--gry2);aspect-ratio:1}
.igcell-ov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .12s;display:flex;align-items:flex-end;justify-content:space-between;padding:6px}
.igcell:hover .igcell-ov{opacity:1}
.igcell-btn{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:none}
.igcell.empty{border:1.5px dashed var(--bdr2);display:flex;align-items:center;justify-content:center}
.igcell.empty:hover{border-color:var(--blk)}

/* ── IG PHONE ── */
.ig-phone{background:#fff;border:.5px solid #dbdbdb;border-radius:13px;overflow:hidden}
.ig-ph-top{padding:3px 9px 0;display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:#1a1a1a;font-family:system-ui}
.ig-ph-hdr{display:flex;align-items:center;padding:6px 9px;border-bottom:.5px solid #dbdbdb;gap:6px}
.ig-ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:1px}
.ig-ph-cell{aspect-ratio:1;background:#f0f0f0;overflow:hidden}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg.hidden{display:none}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:14px;font-weight:600}
.modal-close{width:26px;height:26px;border-radius:50%;background:var(--gry);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2)}
.modal-close:hover{background:var(--gry2)}

/* ── TOAST ── */
#toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast-msg{padding:9px 16px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:tin .2s ease;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast-msg.ok{background:var(--blk);color:#fff}
.toast-msg.err{background:#7a1818;color:#fff}
.toast-msg.wt{background:var(--amb);color:#fff}

/* ── LOGIN ── */
#login-wrap{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
#login-wrap.hidden{display:none}
.login-box{background:var(--card);border-radius:20px;padding:32px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.login-logo{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.login-logo em{font-style:normal;color:var(--amb)}
.login-sub{font-size:12px;color:var(--t3);margin-bottom:24px}

/* ── PAGE HEADERS ── */
.ph{font-size:16px;font-weight:600;letter-spacing:-.35px;margin-bottom:4px}
.psub{font-size:12px;color:var(--t3);margin-bottom:16px}

/* ── TOOLBAR ── */
.tb2{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}

/* ── ACCORDION ── */
.acc-body{overflow:hidden;display:none}
.acc-body.open{display:block}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gry2);border-radius:4px}

/* ── FIRMA CARD ── */
.firma-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.firma-card:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.firma-add{background:var(--card);border-radius:12px;border:1.5px dashed var(--bdr2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--t3);min-height:104px;transition:all .12s}
.firma-add:hover{border-color:var(--blk);color:var(--t1)}

/* ── DETAIL PANEL ── */
.det-panel{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:14px}

/* ── RESPONSIVE ── */
@media(max-width:768px){.sb{display:none}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-box">
    <div class="login-logo">mood<em>kit</em></div>
    <div class="login-sub">Kreatif ajans yönetim paneli</div>
    <div id="login-err" style="display:none;margin-bottom:12px" class="info er">
      <span id="login-err-msg"></span>
    </div>
    <div class="form-g"><label class="fl">E-posta</label><input class="inp" id="li-email" type="email" placeholder="siz@ajans.com" autocomplete="email"></div>
    <div class="form-g"><label class="fl">Şifre</label><input class="inp" id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn solid" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">Giriş Yap</button>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--t3)">Hesabınız yok mu? <span style="color:var(--amb);cursor:pointer" onclick="showRegister()">Kayıt Ol</span></div>
  </div>
</div>

<!-- REGISTER -->
<div id="reg-wrap" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:101;align-items:center;justify-content:center">
  <div class="login-box" style="max-width:400px">
    <div class="login-logo">mood<em>kit</em></div>
    <div class="login-sub" style="margin-bottom:16px">Yeni hesap oluştur</div>
    <div class="form-row">
      <div class="form-g"><label class="fl">Ad Soyad</label><input class="inp" id="rg-name" placeholder="Adınız"></div>
      <div class="form-g"><label class="fl">E-posta</label><input class="inp" id="rg-email" type="email" placeholder="siz@ajans.com"></div>
    </div>
    <div class="form-row">
      <div class="form-g"><label class="fl">Şifre</label><input class="inp" id="rg-pass" type="password" placeholder="Min 8 karakter"></div>
      <div class="form-g"><label class="fl">Rol</label>
        <select class="inp" id="rg-role">
          <option value="ADMIN">Admin</option>
          <option value="EDITOR">Kreatif (Editor)</option>
          <option value="PROD" selected>Prodüksiyon</option>
          <option value="CLIENT">Müşteri</option>
        </select>
      </div>
    </div>
    <div class="form-g"><label class="fl">Ünvan (opsiyonel)</label><input class="inp" id="rg-title" placeholder="Grafik Tasarımcı"></div>
    <button class="btn solid" style="width:100%;justify-content:center;margin-top:4px" onclick="doRegister()">Kayıt Ol</button>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--t3)">Zaten hesabınız var mı? <span style="color:var(--amb);cursor:pointer" onclick="showLogin()">Giriş Yap</span></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <header class="tb">
    <div class="tb-logo">mood<em>kit</em></div>
    <div class="tb-sep"></div>
    <div class="tb-bc" id="bc"><span class="bcu">Dashboard</span></div>
    <div class="tb-right">
      <div class="inp-row" style="width:180px;display:none" id="srch-wrap">

<!-- TOAST -->
<div id="toast-wrap"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const STAGE_TO_PAGE={BRIEF:'brief',MB_IG:'mb',MB_KAMP:'mb-kamp',TASKS:'tasks',YAYIN:'yayin'};
const PAGE_TO_STAGE={brief:'BRIEF',mb:'MB_IG','mb-kamp':'MB_KAMP',tasks:'TASKS',yayin:'YAYIN'};
const STAGE_ORDER=['brief','mb','mb-kamp','tasks','yayin'];
const STATUS_DS={PENDING:'wt',REVIEW:'rv',APPROVED:'ok',REJECTED:'er'};
const STATUS_LBL={PENDING:'Bekliyor',REVIEW:'İncelemede',APPROVED:'Onaylı',REJECTED:'Revize'};
const PLAT={YouTube:['YT','#cc2200'],Vimeo:['Vi','#1AB7EA'],TikTok:['TT','rgba(0,0,0,.7)'],Instagram:['IG','rgba(0,0,0,.35)'],Pinterest:['Pi','rgba(0,0,0,.35)'],Behance:['Be','rgba(0,0,0,.35)'],Video:['MP4','var(--gry3)'],Web:['Web','var(--gry3)']};
const GR=['#1a1a18','#0a0a0f','#2d1f08','#111827','#1c1917','#0f1729','#18120a','#080d18','#1a1208'];

// ── STATE ─────────────────────────────────────────────────
let _me=null, _token=localStorage.getItem('mk_token');
let firms=[], members=[];
let _curFid=null, _curBid=null, _curPage='home';
let _mbFilter='all', _kampFilter='all', _taskFilter='all', _persFilter='all';
let _myTasks=[];

// ── API ───────────────────────────────────────────────────
async function api(path,opts={}){
  const {noAuth,body,method,...rest}=opts;
  const headers={'Content-Type':'application/json'};
  if(!noAuth&&_token) headers['Authorization']='Bearer '+_token;
  const r=await fetch(path,{method:method||'GET',headers,credentials:'include',...rest,
    body:body?JSON.stringify(body):undefined});
  if(r.status===401&&!noAuth){showLogin();throw new Error('Oturum süresi doldu');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||r.statusText);
  return d;
}

async function loadFirms(){firms=await api('/api/firms');}
async function loadBriefs(fid){
  const bs=await api(`/api/firms/${fid}/briefs`);
  const f=gF(fid);if(f)f.briefs=bs;
}
async function loadMembers(){try{members=await api('/api/users');}catch(_){members=[];}}
async function loadMyTasks(){_myTasks=await api('/api/tasks/mine');}
async function loadCards(fid,bid,which){
  const cs=await api(`/api/firms/${fid}/briefs/${bid}/cards?which=${which}`);
  const b=gB(fid,bid);if(!b)return;
  if(which==='IG')b._igCards=cs; else b._kampCards=cs;
  return cs;
}
async function loadIGCells(fid,bid){
  const cs=await api(`/api/firms/${fid}/briefs/${bid}/ig`);
  const b=gB(fid,bid);if(b)b.igCells=cs;
  return cs;
}
async function loadTasks(fid,bid){
  const ts=await api(`/api/firms/${fid}/briefs/${bid}/tasks`);
  const b=gB(fid,bid);if(b)b.tasks=ts;
  return ts;
}

// ── HELPERS ───────────────────────────────────────────────
const gF=id=>firms.find(f=>f.id===id);
const gB=(fid,bid)=>gF(fid)?.briefs?.find(b=>b.id===bid);

function toast(msg,type='ok'){
  const w=document.getElementById('toast-wrap');if(!w)return;
  const el=document.createElement('div');
  el.className='toast-msg '+(type==='err'?'err':type==='wt'?'wt':'ok');
  el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3200);
}

function ytThumb(u){
  if(!u)return null;
  let id=u.match(/[?&]v=([\w-]{11})/)?.[1]||u.match(/youtu\.be\/([\w-]{11})/)?.[1]||u.match(/\/embed\/([\w-]{11})/)?.[1]||u.match(/\/shorts\/([\w-]{11})/)?.[1];
  return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:null;
}

function toEmbed(u){
  if(!u)return null;
  if(u.includes('/embed/'))return u;
  const o=encodeURIComponent(location.origin);
  if(u.includes('watch?v='))return`https://www.youtube.com/embed/${u.split('watch?v=')[1].split('&')[0]}?rel=0&origin=${o}`;
  if(u.includes('youtu.be/'))return`https://www.youtube.com/embed/${u.split('youtu.be/')[1].split('?')[0]}?rel=0&origin=${o}`;
  if(u.includes('/shorts/'))return`https://www.youtube.com/embed/${u.split('/shorts/')[1].split('?')[0]}?rel=0&origin=${o}`;
  if(u.includes('vimeo.com/'))return`https://player.vimeo.com/video/${u.split('vimeo.com/')[1].split('?')[0]}`;
  if(/\.(mp4|mov|webm)$/i.test(u))return u;
  return null;
}

function detectPlat(url){
  if(!url)return null;
  if(url.includes('youtube')||url.includes('youtu.be'))return'YouTube';
  if(url.includes('vimeo'))return'Vimeo';
  if(url.includes('tiktok'))return'TikTok';
  if(url.includes('instagram'))return'Instagram';
  if(url.includes('pinterest'))return'Pinterest';
  if(url.includes('behance'))return'Behance';
  if(/\.(mp4|mov|webm)$/i.test(url))return'Video';
  return'Web';
}

function platBadge(url){
  const p=detectPlat(url);if(!p)return'';
  const[lbl,bg]=PLAT[p]||['?','#888'];
  return`<div class="mb-plat" style="background:${bg}">${lbl}</div>`;
}

function cardThumb(card){
  const v=card.versions?.[card.versions.length-1];
  if(!v)return null;
  return v.mediaUrl||ytThumb(v.videoUrl)||null;
}

function ini(name){return(name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}

function fmtDate(d){
  if(!d)return'';
  const dt=new Date(d);
  return dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
}

function daysLeft(dl){
  if(!dl)return null;
  const diff=Math.ceil((new Date(dl)-new Date())/(1000*60*60*24));
  return diff;
}

function plural(n,s){return`${n} ${s}`;}

// ── NAVIGATION ────────────────────────────────────────────
const BC_MAP={
  home:'Dashboard',pers:'Görevlerim',cust:'Müşteri Paneli',
  brief:'Brief',mb:'IG Moodboard','mb-kamp':'Kampanya MB',
  ig:'IG Grid',tasks:'Görevler',yayin:'Yayın Takvimi'
};

function updateBC(page){
  const el=document.getElementById('bc');if(!el)return;
  const f=gF(_curFid),b=gB(_curFid,_curBid);
  const parts=[];
  if(['brief','mb','mb-kamp','ig','tasks','yayin'].includes(page)&&f){
    parts.push(`<span class="bcr" onclick="go('home')">Dashboard</span><span class="bcs">·</span>`);
    parts.push(`<span class="bcr" onclick="nav('${f.id}','${b?.id||''}','brief')">${f.name}</span><span class="bcs">·</span>`);
    if(b)parts.push(`<span class="bcr" onclick="nav('${f.id}','${b.id}','brief')">${b.month} ${b.year}</span><span class="bcs">·</span>`);
    parts.push(`<span class="bcu">${BC_MAP[page]||page}</span>`);
  } else {
    parts.push(`<span class="bcu">${BC_MAP[page]||'Dashboard'}</span>`);
  }
  el.innerHTML=parts.join('');
}

function updateStagePills(page){
  const idx=STAGE_ORDER.indexOf(page);
  document.querySelectorAll('.stage-pill').forEach((p,i)=>{
    p.className='stage-pill';
    if(i<idx)p.classList.add('done');
    else if(i===idx)p.classList.add('active');
    else p.classList.add('todo');
  });
}

function go(page){
  _curPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('page-'+page)?.classList.add('on');
  document.querySelectorAll('.sb-nav').forEach(s=>s.classList.remove('on'));
  const si={home:'si-home',pers:'si-pers',cust:'si-cust'}[page];
  if(si)document.getElementById(si)?.classList.add('on');
  document.querySelectorAll('.sub-link').forEach(s=>s.classList.remove('on'));
  if(_curFid&&_curBid){
    const sidx={brief:0,mb:1,'mb-kamp':2,ig:3,tasks:4,yayin:5}[page];
    if(sidx!==undefined){
      const links=document.querySelectorAll(`#subs-${_curBid} .sub-link`);
      links[sidx]?.classList.add('on');
    }
  }
  updateBC(page);
  updateStagePills(page);
  renderPage(page);
}

function nav(fid,bid,page='brief'){
  _curFid=fid;_curBid=bid;
  openFirmAccordion(fid);
  go(page);
}

function openFirmAccordion(fid){
  document.querySelectorAll('.acc-body').forEach(el=>{
    if(el.id!==`acc-${fid}`)el.classList.remove('open');
  });
  document.getElementById(`acc-${fid}`)?.classList.add('open');
}

function toggleFirm(fid){
  document.getElementById(`acc-${fid}`)?.classList.toggle('open');
}

// ── SIDEBAR RENDER ─────────────────────────────────────────
function renderSB(){
  const isAdmin=_me?.role==='ADMIN';
  const isCli=_me?.role==='CLIENT';
  document.getElementById('sb-add-firm').style.display=isAdmin?'':'none';
  document.getElementById('si-cust').style.display=isCli?'':'none';
  document.getElementById('si-pers').style.display=isCli?'none':'';

  // pending task count badge
  const pending=_myTasks.filter(t=>t.status==='TODO'||t.status==='DOING').length;
  const badge=document.getElementById('sb-task-cnt');
  if(badge){badge.textContent=pending;badge.style.display=pending?'':'none';}

  const fl=document.getElementById('flist');if(!fl)return;
  fl.innerHTML=firms.map(f=>{
    const bs=f.briefs||[];
    const dot=`<div class="firm-dot" style="background:${f.color||'#1a1a18'}"></div>`;
    const subs=bs.map(b=>`
      <div id="subs-${b.id}" class="sb-subs">
        <div class="sub-link" onclick="nav('${f.id}','${b.id}','brief')">${b.month} ${b.year}</div>
        <div class="sub-link" onclick="nav('${f.id}','${b.id}','mb')">IG Moodboard</div>
        <div class="sub-link" onclick="nav('${f.id}','${b.id}','mb-kamp')">Kampanya MB</div>
        <div class="sub-link" onclick="nav('${f.id}','${b.id}','ig')">IG Grid</div>
        ${isAdmin?`<div class="sub-link" onclick="nav('${f.id}','${b.id}','tasks')">Görevler</div>`:''}
        ${isAdmin?`<div class="sub-link" onclick="nav('${f.id}','${b.id}','yayin')">Yayın</div>`:''}
      </div>`).join('');
    return`<div>
      <div class="firm-row" onclick="toggleFirm('${f.id}')">${dot}<span style="flex:1">${f.name}</span><span class="firm-count">${bs.length} brief</span></div>
      <div class="acc-body" id="acc-${f.id}">${subs}
        ${isAdmin?`<div class="sub-link" style="color:var(--amb)" onclick="openModal('brief','${f.id}')">+ Yeni Brief</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── PAGE DISPATCHER ───────────────────────────────────────
function renderPage(page){
  const fns={home:renderHome,brief:renderBrief,mb:renderMB,'mb-kamp':renderMBKamp,ig:renderIG,tasks:renderTasks,pers:renderPers,cust:renderCust,yayin:renderYayin};
  (fns[page]||renderHome)();
}

// ── HOME ──────────────────────────────────────────────────
function renderHome(){
  const el=document.getElementById('page-home');if(!el)return;
  const allBriefs=firms.flatMap(f=>(f.briefs||[]).map(b=>({...b,_firm:f})));
  const allCards=allBriefs.flatMap(b=>(b.moodboardCards||[]).map(c=>({...c,_brief:b})));
  const allTasks=allBriefs.flatMap(b=>(b.tasks||[]).map(t=>({...t,_brief:b})));
  const allCells=allBriefs.flatMap(b=>(b.igCells||[]));
  const pending=allCards.filter(c=>c.status==='PENDING').length;
  const activeTasks=allTasks.filter(t=>t.status==='TODO'||t.status==='DOING').length;
  const totCells=allCells.length,apCells=allCells.filter(c=>c.approved===true).length;
  const igPct=totCells?Math.round(apCells/totCells*100):0;

  // IG preview cards (latest 3 from all firms)
  const previewCards=allCards.filter(c=>c.which==='IG').slice(0,3);
  const previewTasksHtml=allTasks.filter(t=>t.status!=='DONE').slice(0,3).map(t=>{
    const dl=daysLeft(t.deadline);
    return`<div class="cell">
      <div style="width:6px;height:6px;border-radius:50%;background:${t.status==='DOING'?'var(--amb)':'var(--gry3)'};flex-shrink:0"></div>

        <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.cardRef||t.desc||'Görev'}</div>
        <div style="font-size:10px;color:var(--t3)">${t._brief?._firm?.name||''}</div>
      </div>
      ${dl!==null?`<span class="badge ${dl<0?'b-er':dl<=3?'b-wt':'b-gry'}">${dl<0?'Gecikti':dl===0?'Bugün':dl+' gün'}</span>`:''}
    </div>`;
  }).join('')||'<div style="padding:12px;font-size:11px;color:var(--t3);text-align:center">Aktif görev yok</div>';

  // IG phone cells
  const phoneFirm=firms[0];
  const phoneBrief=phoneFirm?.briefs?.[0];
  const phoneCells=(phoneBrief?.igCells||[]).slice(0,9);
  const phoneGrid=phoneCells.map(c=>`<div class="ig-ph-cell">${c.mediaUrl?`<img src="${c.mediaUrl}" style="width:100%;height:100%;object-fit:cover" loading="lazy">`:`<div style="width:100%;height:100%;background:${GR[phoneCells.indexOf(c)%9]}"></div>`}</div>`).join('')+Array(Math.max(0,9-phoneCells.length)).fill('<div class="ig-ph-cell"></div>').join('');

  el.innerHTML=`
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <div class="ph">Dashboard</div>
        <div class="psub">Hoş geldiniz, ${_me?.name?.split(' ')[0]||'Kullanıcı'}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        <div class="stat"><div class="stat-l">Firmalar</div><div class="stat-v">${firms.length}</div><div class="stat-c">${allBriefs.length} aktif brief</div></div>
        <div class="stat"><div class="stat-l">Bekleyen Onay</div><div class="stat-v">${pending}</div><div class="stat-c" style="color:${pending?'var(--er-c)':'var(--t3)'}">${pending?pending+' kart bekliyor':'Temiz'}</div></div>
        <div class="stat"><div class="stat-l">Aktif Görev</div><div class="stat-v">${activeTasks}</div><div class="stat-c">${allTasks.filter(t=>t.status==='DOING').length} üretimde</div></div>
        <div class="stat"><div class="stat-l">IG Onay</div><div class="stat-v">${igPct}<span style="font-size:14px;color:var(--t3)">%</span></div><div class="prog" style="margin-top:6px"><div class="pf" style="width:${igPct}%"></div></div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px">
        ${firms.map(f=>{
          const lb=f.briefs?.[0];
          const cards=(lb?.moodboardCards||[]);
          const ap=cards.filter(c=>c.status==='APPROVED').length;
          const tot=cards.length;
          const pct=tot?Math.round(ap/tot*100):0;
          const cover=lb?.igCells?.find(c=>c.mediaUrl)?.mediaUrl||lb?.moodboardCards?.find(c=>cardThumb(c))&&cardThumb(lb.moodboardCards.find(c=>cardThumb(c)));
          return`<div class="firma-card" onclick="nav('${f.id}','${lb?.id||''}','brief')">
            <div style="height:70px;background:${f.color||'#1a1a18'};position:relative;display:flex;align-items:flex-end;padding:8px 12px;overflow:hidden">
              ${cover?`<img src="${cover}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35" loading="lazy">`:''}
              <div style="position:relative;z-index:1">

                <span class="badge b-wt">${lb?lb.month+' '+lb.year:'Brief yok'}</span>

        <div>
          <div style="font-size:13px;font-weight:500;margin-bottom:8px">Son Moodboard</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
            ${previewCards.length?previewCards.map(c=>{
              const v=c.versions?.[c.versions.length-1];
              const img=cardThumb(c);
              const ds=STATUS_DS[c.status]||'wt';

                  ${platBadge(v?.videoUrl)}
                </div>
                <div style="padding:8px 9px 9px 11px">
                  <div style="font-size:11px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.label}</div>
                  <div style="display:flex;align-items:center;justify-content:space-between">
                    <span class="badge b-${ds}">${STATUS_LBL[c.status]}</span>
                    <span style="font-size:9px;color:var(--t3)">${c._brief._firm.name}</span>

async function deleteCard(fid,bid,cid,which){
  if(!confirm('Kartı silmek istediğinizden emin misiniz?'))return;
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}`,{method:'DELETE'});

    if(b){b._igCards=b._igCards?.filter(c=>c.id!==cid);b._kampCards=b._kampCards?.filter(c=>c.id!==cid);}

    if(b&&b._igCards){const i=b._igCards.findIndex(c=>c.id===cid);if(i>=0)b._igCards[i].status=status;}

async function cycleTask(fid,bid,tid){
  const b=gB(fid,bid);const t=b?.tasks?.find(x=>x.id===tid);if(!t)return;
  const next={TODO:'DOING',DOING:'DONE',DONE:'TODO'}[t.status]||'TODO';
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/tasks/${tid}`,{method:'PATCH',body:{status:next}});
    t.status=next;renderTasks();toast('Güncellendi');
  }catch(e){toast(e.message,'err');}
}

async function deleteTask(fid,bid,tid){

}

async function approveAllYayin(fid,bid){
  const b=gB(fid,bid);if(!b)return;
  const cells=(b.igCells||[]).filter(c=>c.approved!==true);
  if(!cells.length){toast('Tümü zaten onaylı');return;}
  try{
    await Promise.all(cells.map(c=>api(`/api/firms/${fid}/briefs/${bid}/ig/${c.id}`,{method:'PUT',body:{approved:true}})));
    cells.forEach(c=>c.approved=true);toast(`${cells.length} içerik onaylandı ✓`);renderYayin();
  }catch(e){toast(e.message,'err');}
}


// ── MODAL SYSTEM ──────────────────────────────────────────
function showModal(html){
  document.getElementById('modal-box').innerHTML=html;
  document.getElementById('modal-bg').style.display='flex';
  requestAnimationFrame(()=>document.getElementById('modal-box').classList.add('open'));
}
function closeModal(){
  const bg=document.getElementById('modal-bg');
  const box=document.getElementById('modal-box');
  box.classList.remove('open');
  setTimeout(()=>{ bg.style.display='none'; box.innerHTML=''; },160);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function modalHead(title){
  return`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <div style="font-size:14px;font-weight:600">${title}</div>
    <button class="btn surface xs ico" onclick="closeModal()">✕</button></div>`;
}
function fldRow(label,input){
  return`<div style="margin-bottom:12px"><label style="font-size:11px;color:var(--t2);display:block;margin-bottom:4px">${label}</label>${input}</div>`;
}
function inp(id,type,placeholder,val=''){
  return`<input id="${id}" type="${type}" placeholder="${placeholder}" value="${val}" class="fld" style="width:100%;box-sizing:border-box">`;
}
function sel(id,opts,cur=''){
  return`<select id="${id}" class="fld" style="width:100%;box-sizing:border-box">${opts.map(([v,l])=>`<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('')}</select>`;
}
function ta(id,placeholder,val=''){
  return`<textarea id="${id}" placeholder="${placeholder}" class="fld" style="width:100%;box-sizing:border-box;min-height:80px;resize:vertical">${val}</textarea>`;
}

async function saveCardDet(fid,bid,which,cid){
  const status=document.getElementById('cd-status')?.value;
  const vnote=document.getElementById('cd-vnote')?.value?.trim();
  const body={status};
  if(vnote) body.versionNote=vnote;
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}`,{method:'PATCH',body});
    const b=gB(fid,bid);
    if(b){
      const arr=which==='IG'?(b._igCards||[]):(b._kampCards||[]);
      const idx=arr.findIndex(x=>x.id===cid);
      if(idx>=0) Object.assign(arr[idx],updated);
    }
    closeModal();
    if(which==='IG')renderMB();else renderMBKamp();
    toast('Kaydedildi ✓');
  }catch(e){toast(e.message,'err');}
}

async function submitIGCell(fid,bid,cid){
  const type=document.getElementById('ig-type')?.value||'IMAGE';
  const caption=document.getElementById('ig-cap')?.value?.trim()||'';
  const publishDate=document.getElementById('ig-date')?.value||null;
  const videoUrl=document.getElementById('ig-url')?.value?.trim()||null;
  const mediaUrl=document.getElementById('ig-img')?.value?.trim()||null;
  const location=document.getElementById('ig-loc')?.value?.trim()||null;
  const order=parseInt(document.getElementById('ig-ord')?.value)||0;
  const body={type,caption,order};
  if(publishDate) body.publishDate=new Date(publishDate).toISOString();
  if(videoUrl) body.videoUrl=videoUrl;
  if(mediaUrl) body.mediaUrl=mediaUrl;
  if(location) body.location=location;
  try{
    const b=gB(fid,bid);
    if(cid){
      const updated=await api(`/api/firms/${fid}/briefs/${bid}/ig/${cid}`,{method:'PUT',body});
      if(b){const idx=(b.igCells||[]).findIndex(x=>x.id===cid);if(idx>=0)b.igCells[idx]=updated;}
    }else{
      const created=await api(`/api/firms/${fid}/briefs/${bid}/ig`,{method:'POST',body});
      if(b){if(!b.igCells)b.igCells=[];b.igCells.push(created);}
    }
    closeModal();renderIG();toast('İçerik kaydedildi ✓');
  }catch(e){toast(e.message,'err');}
}

  try{ await api('/api/auth/logout',{method:'POST'}); }catch(_){}
  _token=null;_me=null;firms=[];members=[];_curFid=null;_curBid=null;
  localStorage.removeItem('mk_token');
  showLogin();
}

// ── SEARCH ────────────────────────────────────────────────
let _searchTimer=null;
function onSearch(val){
  clearTimeout(_searchTimer);
  const drop=document.getElementById('search-drop');
  if(!val||val.length<2){if(drop)drop.style.display='none';return;}
  _searchTimer=setTimeout(async()=>{
    try{
      const res=await api(`/api/search?q=${encodeURIComponent(val)}`);
      if(!drop)return;
      if(!res||(!res.briefs?.length&&!res.cards?.length&&!res.tasks?.length)){
        drop.innerHTML='<div style="padding:10px;font-size:11px;color:var(--t3)">Sonuç bulunamadı</div>';
        drop.style.display='block';return;
      }
      let html='';
      if(res.briefs?.length){
        html+=`<div style="padding:6px 10px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase">Brief</div>`;
        html+=res.briefs.slice(0,5).map(b=>`<div class="sr-item" onclick="nav('${b.firmId}','${b.id}','brief');document.getElementById('search-drop').style.display='none';document.querySelector('.tb-search input').value=''">${b.firm?.name||''} <span style="color:var(--t3)">→</span> ${b.month}/${b.year}</div>`).join('');
      }
      if(res.cards?.length){
        html+=`<div style="padding:6px 10px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase">Kart</div>`;
        html+=res.cards.slice(0,5).map(c=>`<div class="sr-item" onclick="nav('${c.brief?.firmId}','${c.briefId}','${c.which==='IG'?'mb':'mb-kamp'}');document.getElementById('search-drop').style.display='none';document.querySelector('.tb-search input').value=''">${c.title||c.videoUrl||'—'}</div>`).join('');
      }
      if(res.tasks?.length){
        html+=`<div style="padding:6px 10px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase">Görev</div>`;
        html+=res.tasks.slice(0,5).map(t=>`<div class="sr-item" onclick="nav('${t.brief?.firmId}','${t.briefId}','tasks');document.getElementById('search-drop').style.display='none';document.querySelector('.tb-search input').value=''">${t.title||'—'}</div>`).join('');
      }
      drop.innerHTML=html;drop.style.display='block';
    }catch(_){if(drop)drop.style.display='none';}
  },300);
}
document.addEventListener('click',e=>{
  const drop=document.getElementById('search-drop');
  if(drop&&!e.target.closest('.tb-search'))drop.style.display='none';
});

// ── INIT APP ──────────────────────────────────────────────
async function initApp(){
  try{
    _me=await api('/api/auth/me');
  }catch(e){
    showLogin();return;
  }
  document.getElementById('app').style.display='flex';
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('reg-wrap').style.display='none';
  const nm=document.getElementById('tb-nm');
  const av=document.getElementById('tb-av');
  const rl=document.getElementById('tb-role');
  if(nm) nm.textContent=_me.name||_me.email;
  if(av) av.textContent=(_me.name||_me.email||'?')[0].toUpperCase();
  if(rl){
    const roleMap={ADMIN:'Admin',EDITOR:'Editör',PROD:'Prodüksiyon',CLIENT:'Müşteri'};
    rl.textContent=roleMap[_me.role]||_me.role;
    rl.className='badge '+(_me.role==='ADMIN'?'b-amb':_me.role==='CLIENT'?'b-ok':'b-gry');
  }
  try{
    await Promise.all([loadMembers(),loadFirms()]);
  }catch(e){ console.error('Load error',e); }
  try{
    await Promise.all(firms.map(f=>loadBriefs(f.id)));
  }catch(e){ console.error('Briefs load error',e); }
  renderSB();
  if(_me.role==='CLIENT'){
    renderClientPortal();
  }else{
    go('home');
  }
  initWS();
}

function renderClientPortal(){
  const myFirms=firms.filter(f=>(f.members||[]).some(m=>m.userId===_me.id));
  if(!myFirms.length){ go('home'); return; }
  const f=myFirms[0];
  const briefs=f.briefs||[];
  const b=briefs[briefs.length-1];
  if(b) nav(f.id,b.id,'cust');
  else go('home');
}

// ── WEBSOCKET ─────────────────────────────────────────────
function initWS(){
  if(!_token) return;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}?token=${_token}`);
  ws.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.type==='notification'||msg.notif){
        const n=msg.notif||msg;
        renderN(n);
      }
    }catch(_){}
  };
  ws.onclose=()=>{ setTimeout(initWS,5000); };
  ws.onerror=()=>{ ws.close(); };
}
function renderN(n){
  toast(n.message||n.body||'Bildirim','wt');
}
// ── BOOTSTRAP ─────────────────────────────────────────────
if(_token){
  initApp();
}else{
  showLogin();
}
</script>
