<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoodKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root{
  --bg:#f0ede6; --bg2:#e8e4da; --bg3:#dedad0; --card:#fff;
  --blk:#1a1a18; --blk2:#2c2c28;
  --amb:#C8720A; --ambL:#FEF3DC;
  --gry:#ede9e0; --gry1:#ede9e0; --gry2:#d8d4ca; --gry3:#b4b0a6;
  --t1:#1a1a18; --t2:#5c5852; --t3:#9c9890;
  --bdr:rgba(26,26,24,.09); --bdr2:rgba(26,26,24,.18);
  --ok-c:#1a5c1a; --ok-bg:rgba(26,92,26,.08); --ok-br:rgba(26,92,26,.18);
  --wt-c:#8a5000; --wt-bg:#FEF3DC; --wt-br:rgba(200,114,10,.22);
  --er-c:#7a1818; --er-bg:rgba(160,30,30,.08); --er-br:rgba(160,30,30,.18);
  --rv:#4a4a48; --rv2:#e0ddd6;
  --r:8px; --r2:12px; --sh:0 2px 12px rgba(0,0,0,.08);
  --tr:120ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;font-size:13px;background:var(--bg);color:var(--t1);line-height:1.5;overflow:hidden;height:100vh}

/* ── APP SHELL ───────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh}
.tb{height:48px;background:var(--card);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0;z-index:100}
.layout{display:flex;flex:1;overflow:hidden;min-height:0}
.sb{width:196px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto;padding:10px 0 12px}
.cnt{flex:1;min-height:0;overflow-y:auto;padding:20px 22px;background:var(--bg)}
.page{display:none}.page.on{display:block}

/* ── TOPBAR ──────────────────────────────────────────────── */
.tb-logo{font-weight:700;font-size:15px;letter-spacing:-.5px;color:var(--blk);white-space:nowrap}
.tb-logo span{color:var(--amb)}
.tb-bc{font-size:11px;color:var(--t3);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-search{position:relative;flex:0 0 200px}
.tb-search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--bdr);border-radius:var(--r);font-size:12px;background:var(--gry1);color:var(--t1);outline:none}
.tb-search input:focus{border-color:var(--amb);background:#fff}
.tb-search::before{content:'⌕';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:14px;pointer-events:none}
#search-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);z-index:200;display:none;max-height:280px;overflow-y:auto}
.sr-item{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr)}
.sr-item:last-child{border:none}.sr-item:hover{background:var(--gry1)}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--amb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;cursor:pointer;flex-shrink:0}
.tb-info{display:flex;flex-direction:column;line-height:1.2}
.tb-nm{font-size:12px;font-weight:600}
.tb-role-badge{font-size:10px;color:var(--t3)}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sb-lbl{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;padding:10px 14px 4px;display:block}
.sb-lnk{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;margin:0 6px 1px;font-size:12px;color:var(--t2);cursor:pointer;transition:background var(--tr),color var(--tr);white-space:nowrap}
.sb-lnk:hover{background:var(--gry);color:var(--t1)}
.sb-lnk.on{background:var(--blk);color:#fff;font-weight:500}
.sb-lnk .ico{font-size:13px;opacity:.6;flex-shrink:0}
.sb-lnk.on .ico{opacity:1}
.sb-hr{height:1px;background:var(--bdr);margin:8px 12px}
.firms-list{flex:1;overflow-y:auto}
.firm-row{padding:0}
.firm-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:8px;margin:0 6px 1px;cursor:pointer;font-size:12px;font-weight:500;color:var(--t1);transition:background var(--tr)}
.firm-hd:hover{background:var(--gry)}
.firm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.firm-cnt{font-size:10px;font-weight:400;color:var(--t3)}
.firm-ch{font-size:10px;color:var(--t3);transition:transform var(--tr)}
.firm-row.open .firm-ch{transform:rotate(90deg)}
.acc-body{display:none;padding-bottom:4px}
.firm-row.open .acc-body{display:block}
.sub-lnk{display:block;padding:5px 10px 5px 22px;border-radius:8px;margin:0 6px 1px;font-size:11px;color:var(--t3);cursor:pointer;transition:background var(--tr),color var(--tr)}
.sub-lnk:hover{background:var(--gry);color:var(--t2)}
.sub-lnk.on{color:var(--t1);font-weight:500}
.sub-lnk.on::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--t1);margin-right:6px;vertical-align:middle;margin-bottom:1px}
.sb-add{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;margin:4px 6px 0;font-size:12px;color:var(--amb);cursor:pointer;transition:background var(--tr)}
.sb-add:hover{background:var(--ambL)}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;height:34px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all var(--tr);white-space:nowrap;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.solid{background:var(--blk);color:#fff}.btn.solid:hover{background:var(--blk2)}
.btn.amber{background:var(--amb);color:#fff}.btn.amber:hover{opacity:.9}
.btn.outline{background:transparent;color:var(--t1);border:1px solid var(--bdr)}.btn.outline:hover{background:var(--gry1)}
.btn.out-a{background:transparent;color:var(--amb);border:1px solid var(--amb)}.btn.out-a:hover{background:var(--ambL)}
.btn.surface{background:var(--gry2);color:var(--t1)}.btn.surface:hover{opacity:.8}
.btn.ok{background:var(--ok-bg);color:var(--ok-c);border:1px solid var(--ok-br)}.btn.ok:hover{background:var(--ok);color:#fff}
.btn.er{background:var(--er-bg);color:var(--er-c);border:1px solid var(--er-br)}.btn.er:hover{background:var(--er);color:#fff}
.btn.xs{padding:4px 10px;font-size:11px;height:26px}.btn.sm{padding:5px 12px;font-size:11px;height:30px}.btn.lg{padding:10px 24px;font-size:14px;height:42px}
.btn.ico{padding:0;width:34px;justify-content:center;border-radius:999px}.btn.xs.ico{width:26px;padding:0}

/* ── BADGES ──────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-c);border:.5px solid var(--ok-br)}
.b-rv{background:#e0ddd6;color:#3a3832;border:.5px solid #c4c0b8}
.b-wt{background:var(--wt-bg);color:var(--wt-c);border:.5px solid var(--wt-br)}
.b-er{background:var(--er-bg);color:var(--er-c);border:.5px solid var(--er-br)}
.b-blk{background:var(--blk);color:#fff}
.b-amb{background:var(--ambL);color:#7a4000;border:.5px solid var(--wt-br)}
.b-gry{background:#c8c4bc;color:#2a2a24;border:.5px solid #a8a49c}

/* ── FORMS ───────────────────────────────────────────────── */
.fld{padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--r);font-size:12px;font-family:inherit;color:var(--t1);background:#fff;width:100%;outline:none;transition:border var(--tr)}
.fld:focus{border-color:var(--amb)}.fld::placeholder{color:var(--t3)}
textarea.fld{min-height:80px;resize:vertical}
.fld-row{margin-bottom:12px}.fld-row label{font-size:11px;color:var(--t3);font-weight:500;display:block;margin-bottom:4px}
.fld-grid{display:grid;gap:12px}.fld-grid-2{grid-template-columns:1fr 1fr}

/* ── STAGE NAV ───────────────────────────────────────────── */
.stage-nav{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;scrollbar-width:none}
.stage-nav::-webkit-scrollbar{display:none}
.stage-pill{padding:5px 12px;border-radius:999px;font-size:10px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all var(--tr);user-select:none;border:none}
.stage-pill.done{background:var(--ok-bg);color:var(--ok-c);border:.5px solid var(--ok-br)}
.stage-pill.active{background:var(--blk);color:#fff}
.stage-pill.todo{background:var(--gry2);color:var(--t2);border:.5px solid var(--bdr)}
.stage-pill.todo:hover{background:var(--gry3);color:var(--t1)}
.stage-arrow{color:var(--t3);font-size:11px;flex-shrink:0}

/* ── CARDS ───────────────────────────────────────────────── */
.card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:16px}
.card-grid{display:grid;gap:16px}
.card-grid-2{grid-template-columns:1fr 1fr}
.card-grid-3{grid-template-columns:1fr 1fr 1fr}
.card-grid-4{grid-template-columns:repeat(4,1fr)}

/* ── MOODBOARD CARDS ─────────────────────────────────────── */
.mb-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);overflow:hidden;position:relative;cursor:pointer;transition:border-color var(--tr),transform var(--tr)}
.mb-card:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.mb-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:1}
.mb-card[data-s="PENDING"]::before,.mb-card[data-s="wt"]::before{background:var(--amb)}
.mb-card[data-s="REVIEW"]::before,.mb-card[data-s="rv"]::before{background:var(--gry3)}
.mb-card[data-s="APPROVED"]::before,.mb-card[data-s="ok"]::before{background:rgba(26,92,26,.55)}
.mb-card[data-s="REJECTED"]::before,.mb-card[data-s="er"]::before{background:rgba(160,30,30,.6)}
.mb-ov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity var(--tr);display:flex;align-items:center;justify-content:center;gap:5px;z-index:2}
.mb-card:hover .mb-ov{opacity:1}
.mb-ov-btn{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:none}
.mb-thumb{width:100%;height:82px;object-fit:cover;display:block;background:var(--gry)}
.mb-thumb-ph{width:100%;height:82px;background:var(--gry);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gry2)}
.mb-body{padding:8px 9px 9px 11px}
.mb-label{font-size:11px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-meta{font-size:9px;color:var(--t3);display:flex;align-items:center;justify-content:space-between}
.mb-actions{padding:8px;border-top:1px solid var(--bdr);display:flex;gap:6px;justify-content:flex-end}

/* ── KANBAN ──────────────────────────────────────────────── */
.kb-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.kb-col{background:var(--gry);border-radius:12px;padding:10px}
.kb-col-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.kb-col-ttl{font-size:12px;font-weight:500;color:var(--t1)}
.kb-cnt{font-size:10px;background:var(--card);border-radius:999px;padding:1px 7px;color:var(--t2);font-weight:600}
.tc{background:var(--card);border-radius:10px;border:1px solid var(--bdr);padding:0;margin-bottom:5px;cursor:grab;overflow:hidden;position:relative}
.tc:hover{border-color:var(--bdr2)}
.tc:last-child{margin-bottom:0}
.tc-acc{position:absolute;left:0;top:0;bottom:0;width:3px}
.tc-ref{font-size:9px;color:var(--t3);margin-bottom:2px}
.tc-title{font-size:11px;font-weight:500;margin-bottom:6px}
.tc-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tc-actions{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
.tc.drg{opacity:.4;box-shadow:0 0 0 2px var(--amb)}

/* ── IG GRID ─────────────────────────────────────────────── */
.ig-wrap{display:grid;grid-template-columns:1fr 184px;gap:14px;align-items:start}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.igcell{border-radius:8px;overflow:hidden;position:relative;cursor:pointer;background:var(--gry2);aspect-ratio:1}
.igcell img,.igcell video{width:100%;height:100%;object-fit:cover;display:block}
.igcell-ov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity var(--tr);display:flex;align-items:flex-end;justify-content:space-between;padding:6px;z-index:2}
.igcell:hover .igcell-ov{opacity:1}
.igcell-btn{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:none}
.igcell-idx{position:absolute;top:5px;left:6px;font-size:9px;font-weight:700;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));z-index:1}
.igcell-type{position:absolute;top:5px;right:6px;font-size:10px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));z-index:1}
.igcell-appr{position:absolute;bottom:5px;right:5px;font-size:10px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));z-index:1}
.igcell-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:20px;color:var(--gry3);gap:4px}
.igcell-ph span{font-size:9px;color:var(--t3)}

/* ── IG PHONE ────────────────────────────────────────────── */
.ig-phone{width:184px;flex-shrink:0;background:#fff;border:1px solid var(--bdr);border-radius:20px;overflow:hidden;padding:8px}
.ig-ph-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ig-ph-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;object-fit:cover}
.ig-ph-nm{font-size:10px;font-weight:600}
.ig-ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.ig-ph-cell{aspect-ratio:1;background:var(--gry1);overflow:hidden}
.ig-ph-cell img{width:100%;height:100%;object-fit:cover}

/* ── STAT CARD ───────────────────────────────────────────── */
.stat{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:14px 16px}
.stat-l{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat-v{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.5px;line-height:1}
.stat-c{font-size:10px;margin-top:3px}
.stat-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:14px 16px}
.stat-num{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.5px;line-height:1}
.stat-lbl{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}

/* ── PROGRESS ────────────────────────────────────────────── */
.prog{height:2px;background:var(--gry2);border-radius:2px;overflow:hidden;margin:4px 0}
.pf{height:100%;border-radius:2px;background:var(--blk)}
.prog-bar{background:var(--gry2);border-radius:2px;height:2px;overflow:hidden}
.prog-bar.thick{height:6px}
.prog-fill{height:100%;border-radius:2px;background:var(--amb);transition:width .3s ease}

/* ── IG PHONE ────────────────────────────────────────────── */
.ig-phone{background:#fff;border:.5px solid #dbdbdb;border-radius:13px;overflow:hidden}
.ig-ph-top{padding:3px 9px 0;display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:#1a1a1a;font-family:system-ui}
.ig-ph-hdr{display:flex;align-items:center;padding:6px 9px;border-bottom:.5px solid #dbdbdb;gap:6px}
.ig-ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:1px}
.ig-ph-cell{aspect-ratio:1;background:#f0f0f0}

/* ── MODAL ───────────────────────────────────────────────── */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;padding:16px}
#modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18);transform:translateY(8px);opacity:0;transition:all var(--tr)}
#modal-box.open{transform:none;opacity:1}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-ttl{font-size:15px;font-weight:600}
.modal-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr)}

/* ── TOAST ───────────────────────────────────────────────── */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:600;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast-msg{padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;box-shadow:var(--sh);animation:tin .2s ease;max-width:300px}
.toast-msg.ok{background:var(--blk);color:#fff}
.toast-msg.err{background:rgba(160,30,30,.9);color:#fff}
.toast-msg.amb{background:var(--amb);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── LOGIN / REGISTER ────────────────────────────────────── */
.auth-wrap{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;align-items:center;justify-content:center}
.auth-box{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:32px;width:360px;box-shadow:var(--sh)}
.auth-logo{font-size:22px;font-weight:700;margin-bottom:24px;text-align:center}
.auth-logo span{color:var(--amb)}

/* ── SECTION HEADER ──────────────────────────────────────── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-ttl{font-size:13px;font-weight:600;letter-spacing:-.2px}

/* ── INFO BLOCK ──────────────────────────────────────────── */
.info-block{background:var(--gry);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--t2)}
.info-block strong{color:var(--t1)}
.info{display:flex;gap:9px;padding:10px 12px;border-radius:10px;font-size:11px;line-height:1.55;margin-bottom:10px}
.info.ok{background:var(--ok-bg);color:var(--ok-c)}
.info.wt{background:var(--wt-bg);color:var(--wt-c)}
.info.er{background:var(--er-bg);color:var(--er-c)}
.info-ico{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:10px}

/* ── SEGMENTED CONTROL ───────────────────────────────────── */
.seg{display:inline-flex;background:var(--gry2);border-radius:10px;padding:2px;gap:1px}
.seg-b{padding:4px 11px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;color:var(--t2);border:none;background:transparent;font-family:'Inter',system-ui;transition:all .1s}
.seg-b.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ── FILTER TAGS ─────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:500;cursor:pointer;transition:all .1s;border:none;background:transparent}
.tag.filled{background:var(--blk);color:#fff}
.tag.ot{background:var(--card);color:var(--t1);border:1.5px solid var(--bdr2)}
.tag.ot:hover{background:var(--gry)}
.tag.sf{background:var(--gry2);color:var(--t1)}
.tag.sf:hover{background:var(--gry3)}
.tag.on{background:var(--blk);color:#fff}

/* ── CELL (list row) ─────────────────────────────────────── */
.cell{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);cursor:pointer;transition:all .1s;margin-bottom:5px}
.cell:hover{background:var(--gry);border-color:var(--bdr2)}

/* ── TASK CARD STRIP ─────────────────────────────────────── */
.tc-check{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;font-size:11px;color:var(--t2)}
.tc-check input[type=checkbox]{accent-color:var(--amb);width:13px;height:13px;flex-shrink:0;cursor:pointer}
.tc-check.done-item{text-decoration:line-through;color:var(--t3)}

/* ── IG CELL EMPTY ───────────────────────────────────────── */

.sep{height:1px;background:var(--bdr);margin:14px 0}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:500;background:var(--gry);color:var(--t2);border:1px solid var(--bdr);cursor:pointer;transition:all var(--tr)}

      <!-- PAGE: IG MOODBOARD -->

  <div id="modal-box"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const STAGE_PAGES={BRIEF:'brief',MB_IG:'mb',MB_KAMP:'mb-kamp',TASKS:'tasks',YAYIN:'yayin'};
const PAGE_STAGES={'brief':'BRIEF','mb':'MB_IG','mb-kamp':'MB_KAMP','tasks':'TASKS','yayin':'YAYIN'};
const STAGE_ORDER=['brief','mb','mb-kamp','tasks','yayin'];
const STAGE_LABELS={home:'Ana Sayfa',brief:'Brief',mb:'IG Moodboard','mb-kamp':'Kampanya MB',ig:'IG Grid',tasks:'Görevler',yayin:'Yayın',pers:'Görevlerim',cust:'Müşteri Portalı',team:'Ekip Yönetimi'};
const STATUS_CLS={PENDING:'b-gry',REVIEW:'b-rv',APPROVED:'b-ok',REJECTED:'b-er'};
const STATUS_LBL={PENDING:'Bekliyor',REVIEW:'İncelemede',APPROVED:'Onaylandı',REJECTED:'Reddedildi'};

// ── STATE ─────────────────────────────────────────────────
let _me=null, _token=localStorage.getItem('mk_token');
let firms=[], members=[], _myTasks=[];
let _curFid=null, _curBid=null, _curPage='home';

// ── API ───────────────────────────────────────────────────
async function api(path,opts={}){
  const {noAuth,body,method,...rest}=opts;
  const headers={'Content-Type':'application/json'};
  if(!noAuth&&_token) headers['Authorization']='Bearer '+_token;
  const r=await fetch(path,{method:method||'GET',headers,credentials:'include',...rest,
    body:body?JSON.stringify(body):undefined});
  if(r.status===401&&!noAuth){showLogin();throw new Error('Oturum süresi doldu');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||r.statusText);
  return d;
}

// ── HELPERS ───────────────────────────────────────────────
const gF=id=>firms.find(f=>f.id===id);
const gB=(fid,bid)=>gF(fid)?.briefs?.find(b=>b.id===bid);

function toEmbed(u){
  if(!u)return null;
  if(u.includes('youtube.com/embed/')||u.includes('player.vimeo.com'))return u;
  // YouTube: watch?v=, youtu.be/, shorts/, embed/
  const ytm=u.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);
  if(ytm)return`https://www.youtube.com/embed/${ytm[1]}?rel=0&modestbranding=1`;
  // Vimeo: vimeo.com/12345678
  const vim=u.match(/vimeo\.com\/(\d+)/);
  if(vim)return`https://player.vimeo.com/video/${vim[1]}`;
  return null;
}
function ytThumb(u){
  if(!u)return null;
  const m=u.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);
  return m?`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`:null;
}
function fmtDate(d){
  if(!d)return'—';
  try{return new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'});}
  catch{return String(d).slice(0,10);}
}
function briefTitle(b){
  // month is stored as Turkish string ("Ocak") from backend
  return`${b.month||'—'} ${b.year||''}`.trim();
}

function toast(msg,type='ok'){
  const w=document.getElementById('toast-wrap');if(!w)return;
  const el=document.createElement('div');
  el.className='toast-msg '+(type==='err'?'err':type==='amb'?'amb':'ok');
  el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3200);
}

// ── MODAL ─────────────────────────────────────────────────
function showModal(html){
  const box=document.getElementById('modal-box');
  const bg=document.getElementById('modal-bg');
  box.innerHTML=html;bg.style.display='flex';
  requestAnimationFrame(()=>box.classList.add('open'));
}
function closeModal(){
  const box=document.getElementById('modal-box');
  box.classList.remove('open');
  setTimeout(()=>{document.getElementById('modal-bg').style.display='none';box.innerHTML='';},160);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function mHd(title){
  return`<div class="modal-hd"><div class="modal-ttl">${title}</div><button class="btn surface xs ico" onclick="closeModal()">✕</button></div>`;
}
function mFt(...btns){return`<div class="modal-ft">${btns.join('')}</div>`;}
function fRow(label,input){return`<div class="fld-row"><label>${label}</label>${input}</div>`;}
function fInp(id,type,ph,val=''){return`<input id="${id}" type="${type}" placeholder="${ph}" value="${val||''}" class="fld">`;}
function fSel(id,opts,cur=''){return`<select id="${id}" class="fld">${opts.map(([v,l])=>`<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('')}</select>`;}
function fTa(id,ph,val=''){return`<textarea id="${id}" placeholder="${ph}" class="fld">${val||''}</textarea>`;}
function v(id){return document.getElementById(id)?.value?.trim()||'';}
function vb(id){const el=document.getElementById(id);return el?el.checked:false;}

// ── DATA LOADERS ──────────────────────────────────────────
async function loadFirms(){
  const data=await api('/api/firms');
  firms=data.map(f=>({...f,briefs:f.briefs||[]}));
}
async function loadBriefs(fid){
  const bs=await api(`/api/firms/${fid}/briefs`);
  const f=gF(fid);if(f)f.briefs=bs;
}
async function loadMembers(){
  try{members=await api('/api/users');}catch{members=[];}
}
async function loadMyTasks(){
  try{_myTasks=await api('/api/tasks/mine');}catch{_myTasks=[];}
}

// ── NAVIGATION ────────────────────────────────────────────
function go(page){
  _curPage=page;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  const pg=document.getElementById('page-'+page);
  if(pg)pg.classList.add('on');

  // Topbar breadcrumb
  const bcEl=document.getElementById('bc');
  if(bcEl){
    const f=gF(_curFid),b=gB(_curFid,_curBid);
    const parts=[];
    if(f)parts.push(f.name);
    if(b)parts.push(briefTitle(b));
    parts.push(STAGE_LABELS[page]||page);
    bcEl.textContent=parts.join(' › ');
  }

  // Sidebar active links
  ['home','pers','cust','team'].forEach(id=>{
    const el=document.getElementById('si-'+id);
    if(el)el.classList.toggle('on',page===id);
  });
  document.querySelectorAll('.sub-lnk').forEach(el=>{
    el.classList.toggle('on',el.dataset.page===page&&el.dataset.fid===_curFid&&el.dataset.bid===_curBid);
  });

  // Render the page
  const renders={home:renderHome,brief:renderBrief,mb:renderMB,'mb-kamp':renderMBKamp,
    ig:renderIG,tasks:renderTasks,pers:renderPers,cust:renderCust,yayin:renderYayin,team:renderTeam};
  if(renders[page])renders[page]();
}

function nav(fid,bid,page){
  _curFid=fid;_curBid=bid;_curPage=page; // Set page first so renderSB highlights correctly
  renderSB(); // Re-render sidebar so sub-links (IG Grid etc.) appear
  go(page);
}

function toggleFirm(fid){
  const el=document.querySelector(`.firm-row[data-fid="${fid}"]`);
  if(el)el.classList.toggle('open');
}

function renderSB(){
  const el=document.getElementById('flist');if(!el)return;
  const isAdmin=_me?.role==='ADMIN';
  document.getElementById('sb-add-firm').style.display=isAdmin?'':'none';
  if(!firms.length){el.innerHTML='<div class="empty" style="font-size:11px">Firma yok</div>';return;}
  el.innerHTML=firms.map(f=>{
    const bs=f.briefs||[];
    return`<div class="firm-row${_curFid===f.id?' open':''}" data-fid="${f.id}">
      <div class="firm-hd" onclick="toggleFirm('${f.id}')">
        <span class="firm-dot" style="background:${f.color||'#534AB7'}"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
        <span class="firm-ch">›</span>
      </div>
      <div class="acc-body">
        ${bs.map(b=>{
          const isOnFirm=_curBid===b.id&&_curFid===f.id;
          const activePg=isOnFirm?_curPage:null;
          const subLinks=[['brief','📋'],['mb','🎨'],['mb-kamp','🎬'],['ig','📷'],['tasks','✓'],['yayin','🚀']];
          const subLbls={brief:'Brief',mb:'IG MB',  'mb-kamp':'Kampanya MB',ig:'IG Grid',tasks:'Görevler',yayin:'Yayın'};
          return`<div class="sub-lnk${isOnFirm?' on':''}" data-fid="${f.id}" data-bid="${b.id}" data-page="brief"
            onclick="nav('${f.id}','${b.id}','brief')" style="justify-content:space-between">
            <span style="display:flex;align-items:center;gap:6px"><span class="stage-dot"></span>${briefTitle(b)}</span>
          </div>
          ${isOnFirm?`<div style="padding-left:16px;padding-bottom:4px">
            ${subLinks.map(([pg,ico])=>`<div class="sub-lnk${activePg===pg?' on':''}"
              style="padding:4px 8px;border-radius:4px;font-size:10px"
              onclick="nav('${f.id}','${b.id}','${pg}')">${ico} ${subLbls[pg]}</div>`).join('')}
          </div>`:''}`;
        }).join('')}
        <div class="sub-lnk" onclick="openBriefModal('${f.id}')" style="color:var(--amb)">+ Brief Ekle</div>
      </div>
    </div>`;
  }).join('');
}

// ── PAGE: HOME ────────────────────────────────────────────
function renderHome(){
  const allBriefs=firms.flatMap(f=>f.briefs||[]);
  const allTasks=allBriefs.flatMap(b=>b.tasks||[]);
  const doneTasks=allTasks.filter(t=>t.status==='DONE').length;
  const totalTasks=allTasks.length;
  const isAdmin=_me?.role==='ADMIN';
  const allCards=allBriefs.flatMap(b=>b._igCards||[]);
  const pendingApproval=allCards.filter(c=>c.status==='REVIEW').length;
  const allCells=allBriefs.flatMap(b=>b.igCells||[]);
  const approvedCells=allCells.filter(c=>c.approved===true).length;
  const igPct=allCells.length?Math.round(approvedCells/allCells.length*100):0;
  const stsCls2={PENDING:'b-gry',REVIEW:'b-rv',APPROVED:'b-ok',REJECTED:'b-er'};
  const stsLbl2={PENDING:'Bekliyor',REVIEW:'İnceleme',APPROVED:'Onaylı',REJECTED:'Reddedildi'};

  const firmCards=firms.map(f=>{
    const bs=f.briefs||[];
    const lastB=bs[bs.length-1];
    const stage=lastB?STAGE_PAGES[lastB.stage]||'brief':null;
    const fCards=allBriefs.filter(b=>b.firmId===f.id).flatMap(b=>b._igCards||[]);
    const fAppr=fCards.filter(c=>c.status==='APPROVED').length;
    const fPct=fCards.length?Math.round(fAppr/fCards.length*100):0;
    const clickAct=lastB?`nav('${f.id}','${lastB.id}','${stage}')`:`openBriefModal('${f.id}')`;
    return`<div style="background:var(--card);border-radius:12px;border:1px solid var(--bdr);overflow:hidden;cursor:pointer" onclick="${clickAct}">
      <div style="height:70px;background:#1a1a18;position:relative;display:flex;align-items:flex-end;padding:8px 12px">
        <div style="position:absolute;inset:0;background:linear-gradient(155deg,#2c2c28,#1a1a18)"></div>
        <div style="position:relative;z-index:1">
          <div style="font-size:12px;font-weight:600;color:#fff">${f.name}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.38);margin-top:1px">${f.sector||'—'}</div>
        </div>
      </div>
      <div style="padding:10px 12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          ${lastB?`<span class="badge b-wt">${briefTitle(lastB)}</span><span class="badge b-rv">${STAGE_LABELS[stage]||'—'}</span>`:'<span class="badge b-gry">Brief yok</span><span></span>'}
        </div>
        <div class="prog"><div class="pf" style="width:${fPct}%"></div></div>
        <div style="font-size:9px;color:var(--t3);margin-top:3px">${fAppr}/${fCards.length} onaylı · ${bs.length} brief</div>
      </div>
    </div>`;
  }).join('');

  const ff=firms[0],fb=ff?.briefs?.[0];
  const initials=(ff?.name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  const handle=(ff?.name||'firma').toLowerCase().replace(/\s+/g,'_');
  const igBtnAct=fb?`nav('${ff.id}','${fb.id}','ig')`:'openFirmModal()';
  const mbBtnAct=fb?`nav('${ff.id}','${fb.id}','mb')`:'openFirmModal()';
  const phoneCells=Array.from({length:6},()=>'<div class="ig-ph-cell"></div>').join('');
  const recentCards=allCards.filter(c=>c.status!=='PENDING').slice(0,3);
  const activeTasks=allTasks.filter(t=>t.status!=='DONE');

  document.getElementById('page-home').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:16px;font-weight:600;letter-spacing:-.35px">Hoş geldiniz, ${(_me?.name||'').split(' ')[0]||'—'}</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">${firms.length} firma · ${allBriefs.length} brief · ${totalTasks} görev</div>
      </div>
      ${isAdmin?`<div style="display:flex;gap:8px"><button class="btn outline sm" onclick="go('team')">Ekip Yönetimi</button><button class="btn amber sm" onclick="openFirmModal()">+ Firma Ekle</button></div>`:''}
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      <div class="stat"><div class="stat-l">Firmalar</div><div class="stat-v">${firms.length}</div></div>
      <div class="stat"><div class="stat-l">Bekleyen Onay</div><div class="stat-v">${pendingApproval}</div><div class="stat-c" style="color:${pendingApproval?'var(--wt-c)':'var(--t3)'}">${pendingApproval?pendingApproval+' kart':'Onay yok'}</div></div>
      <div class="stat"><div class="stat-l">Aktif Görev</div><div class="stat-v">${activeTasks.length}</div><div class="stat-c">${doneTasks}/${totalTasks} tamamlandı</div></div>
      <div class="stat"><div class="stat-l">IG Onay %</div><div class="stat-v">${igPct}%</div><div class="stat-c">${approvedCells}/${allCells.length} onaylı</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-bottom:16px">
      ${firmCards}${isAdmin?`<div style="background:transparent;border-radius:12px;border:1.5px dashed var(--bdr2);cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--t3);font-size:12px" onclick="openFirmModal()">+ Firma Ekle</div>`:''}
    </div>

// ── CARD ACTIONS ──────────────────────────────────────────
async function updateCard(fid,bid,which,cid,status){
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}`,{method:'PUT',body:{status}});
    const b=gB(fid,bid);
    if(b){
      const arr=which==='IG'?(b._igCards||[]):(b._kampCards||[]);
      const idx=arr.findIndex(c=>c.id===cid);
      if(idx>=0)Object.assign(arr[idx],updated);
    }
    if(which==='IG')renderMB();else renderMBKamp();
    toast(status==='APPROVED'?'Onaylandı ✓':'Reddedildi','ok');
  }catch(e){toast(e.message,'err');}
}

async function deleteCard(fid,bid,which,cid){
  if(!confirm('Kartı silmek istediğinize emin misiniz?'))return;
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}`,{method:'DELETE'});
    const b=gB(fid,bid);
    if(b){
      if(which==='IG')b._igCards=(b._igCards||[]).filter(c=>c.id!==cid);
      else b._kampCards=(b._kampCards||[]).filter(c=>c.id!==cid);
    }
    if(which==='IG')renderMB();else renderMBKamp();
    toast('Kart silindi');
  }catch(e){toast(e.message,'err');}
}

async function openCardDet(fid,bid,which,cid){

  const arr=which==='IG'?(b._igCards||[]):(b._kampCards||[]);
  let c=arr.find(x=>x.id===cid);
  if(!c)return;

  const v0=c.versions?.at(-1)||c.versions?.[0]; // latest version
  const embed=v0?.videoUrl?toEmbed(v0.videoUrl):null;
  const thumb=v0?.mediaUrl||(v0?.videoUrl?ytThumb(v0.videoUrl):null);

  showModal(`${mHd(c.label)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div>
        ${embed?`<div style="position:relative;padding-bottom:56.25%;background:#000;border-radius:8px;overflow:hidden;margin-bottom:10px">
          <iframe src="${embed}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div>`
          :thumb?`<img src="${thumb}" style="width:100%;border-radius:8px;margin-bottom:10px;max-height:180px;object-fit:cover">`:''}
        <div style="font-size:11px;color:var(--t3);margin-bottom:8px">${c.type}</div>
        ${v0?.desc?`<div class="info-block">${v0.desc}</div>`:''}
      </div>
      <div>
        ${fRow('Durum',fSel('cd-status',[['PENDING','Bekliyor'],['REVIEW','İncelemede'],['APPROVED','Onaylandı'],['REJECTED','Reddedildi']],c.status))}
        <div style="font-size:11px;font-weight:600;margin-bottom:6px;color:var(--t3)">Yeni Versiyon Ekle</div>
        ${fRow('Versiyon Notu',fInp('cd-vnote','text','v2 açıklaması...'))}
        ${fRow('Video URL',fInp('cd-vurl','url','https://youtube.com/...'))}
        ${fRow('Görsel URL',fInp('cd-vimg','url','https://...'))}
        <div style="font-size:11px;font-weight:600;margin-bottom:6px;margin-top:12px;color:var(--t3)">Versiyon Geçmişi</div>
        <div style="max-height:100px;overflow-y:auto">
          ${(c.versions||[]).map(ver=>`<div style="padding:4px 0;border-bottom:1px solid var(--bdr);font-size:11px">
            <span style="font-weight:600">v${ver.vNum}</span> — ${ver.note} <span style="color:var(--t3)">${fmtDate(ver.createdAt)}</span>
          </div>`).join('')||'<div style="color:var(--t3);font-size:11px">Versiyon yok</div>'}
        </div>
      </div>
    </div>
    ${mFt(
      `<button class="btn surface" onclick="closeModal()">Kapat</button>`,
      `<button class="btn outline" onclick="addCardVersion('${fid}','${bid}','${cid}')">+ Versiyon</button>`,
      `<button class="btn amber" onclick="saveCardStatus('${fid}','${bid}','${which}','${cid}')">Kaydet</button>`
    )}`);
}

async function saveCardStatus(fid,bid,which,cid){
  const status=v('cd-status');
  if(!status)return;
  await updateCard(fid,bid,which,cid,status);
  closeModal();
}

async function addCardVersion(fid,bid,cid){
  const note=v('cd-vnote');
  const videoUrl=v('cd-vurl')||undefined;
  const mediaUrl=v('cd-vimg')||undefined;
  if(!note){toast('Versiyon notu gerekli','err');return;}
  try{
    const ver=await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}/versions`,
      {method:'POST',body:{note,videoUrl,mediaUrl}});
    // Reload card versions
    const b=gB(fid,bid);
    if(b){
      const allArr=[...(b._igCards||[]),...(b._kampCards||[])];
      const c=allArr.find(x=>x.id===cid);
      if(c){if(!c.versions)c.versions=[];c.versions.push(ver);} // push = newest last, at(-1) gets latest
    }
    toast('Versiyon eklendi ✓');closeModal();
  }catch(e){toast(e.message,'err');}
}

async function approveAllIG(fid,bid){
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/ig/approve-all`,{method:'POST'});
    const b=gB(fid,bid);
    if(b&&b.igCells)b.igCells.forEach(c=>c.approved=true);

}

function openIGCell(fid,bid,cid){
  const b=gB(fid,bid);if(!b)return;
  const cell=(b.igCells||[]).find(c=>c.id===cid);if(!cell)return;
  const embed=cell.videoUrl?toEmbed(cell.videoUrl):null;
  const thumb=cell.mediaUrl||(cell.videoUrl?ytThumb(cell.videoUrl):null);
  const typeLbl={POST:'📷 Post',REELS:'🎬 Reels',CAROUSEL:'🎠 Carousel'};
  showModal(`${mHd(`Hücre ${cell.cellIndex+1} — ${typeLbl[cell.type]||cell.type}`)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div>
        ${embed?`<div style="position:relative;padding-bottom:56.25%;background:#000;border-radius:8px;overflow:hidden;margin-bottom:10px">
          <iframe src="${embed}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div>`
          :thumb?`<img src="${thumb}" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover;margin-bottom:10px">`:''}
        ${cell.caption?`<div class="info-block">${cell.caption}</div>`:''}
        ${cell.hashtags?`<div style="font-size:11px;color:var(--t3);margin-top:6px">${cell.hashtags}</div>`:''}
      </div>
      <div>
        <div style="margin-bottom:8px">${fRow('Yayın Tarihi',fInp('ic-date','date','',cell.publishDate?.slice(0,10)||''))}</div>
        <div style="margin-bottom:12px">${fRow('Altyazı',fTa('ic-cap','Altyazı...',cell.caption||''))}</div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:8px">Durum: <strong>${cell.approved?'Onaylı':cell.approved===false?'Reddedildi':'Bekliyor'}</strong></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn ok xs" onclick="toggleIGApprove('${fid}','${bid}','${cid}',true)">✓ Onayla</button>
          <button class="btn er xs" onclick="toggleIGApprove('${fid}','${bid}','${cid}',false)">✕ Reddet</button>
          <button class="btn surface xs ico" onclick="deleteIGCell('${fid}','${bid}','${cid}')">🗑</button>
        </div>
      </div>

    ${mFt(
      `<button class="btn surface" onclick="closeModal()">Kapat</button>`,
      `<button class="btn amber" onclick="saveIGCell('${fid}','${bid}','${cid}')">Kaydet</button>`
    )}`);
}

async function saveIGCell(fid,bid,cid){
  const body={caption:v('ic-cap')||undefined,publishDate:v('ic-date')||undefined};
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/ig/${cid}`,{method:'PUT',body});
    const b=gB(fid,bid);
    if(b){const idx=(b.igCells||[]).findIndex(c=>c.id===cid);if(idx>=0)Object.assign(b.igCells[idx],updated);}
    closeModal();renderIG();toast('Kaydedildi ✓');
  }catch(e){toast(e.message,'err');}
}

async function toggleIGApprove(fid,bid,cid,val){
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/ig/${cid}`,{method:'PUT',body:{approved:val}});
    const b=gB(fid,bid);
    if(b){const idx=(b.igCells||[]).findIndex(c=>c.id===cid);if(idx>=0)Object.assign(b.igCells[idx],updated);}
    closeModal();renderIG();toast(val?'Onaylandı ✓':'Reddedildi');
  }catch(e){toast(e.message,'err');}
}

async function deleteIGCell(fid,bid,cid){
  if(!confirm('İçeriği silmek istiyor musunuz?'))return;
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/ig/${cid}`,{method:'DELETE'});
    const b=gB(fid,bid);
    if(b)b.igCells=(b.igCells||[]).filter(c=>c.id!==cid);
    closeModal();renderIG();toast('Silindi');
  }catch(e){toast(e.message,'err');}
}

async function renderTasks(){

  if(!f||!b){document.getElementById('page-tasks').innerHTML='<div class="empty">Brief bulunamadı</div>';return;}


  // Always reload for kanban — brief load doesn't include assignee details
  try{b.tasks=await api(`/api/firms/${f.id}/briefs/${b.id}/tasks`);}
  catch{if(!b.tasks)b.tasks=[];}
  const tasks=b.tasks||[];
  const cols=['TODO','DOING','DONE'];
  const colLabels={TODO:'Yapılacak',DOING:'Yapılıyor',DONE:'Tamamlandı'};

      </div>
      ${colTasks.map(t=>{

        const stripClr=status==='TODO'?'var(--gry2)':status==='DOING'?'var(--amb)':'var(--ok)';
        return`<div class="tc" style="display:flex;gap:8px;padding:0;overflow:hidden">
          <div class="tc-acc" style="background:${stripClr}"></div>
          <div class="tc-inner" style="padding:10px 10px 10px 0">

      <button class="btn amber" onclick="openTaskModal('${f.id}','${b.id}')">+ Görev Ekle</button>
    </div>

}

async function cycleTask(fid,bid,tid){
  const b=gB(fid,bid);if(!b)return;
  const t=(b.tasks||[]).find(x=>x.id===tid);if(!t)return;
  const next={TODO:'DOING',DOING:'DONE',DONE:'TODO'}[t.status];
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/tasks/${tid}`,{method:'PUT',body:{status:next}});
    Object.assign(t,updated);
    renderTasks();toast(`${next==='TODO'?'Sıfırlandı':next==='DOING'?'Başlandı':'Tamamlandı'} ✓`);
  }catch(e){toast(e.message,'err');}
}

async function deleteTask(fid,bid,tid){
  if(!confirm('Görevi silmek istiyor musunuz?'))return;
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/tasks/${tid}`,{method:'DELETE'});
    const b=gB(fid,bid);
    if(b)b.tasks=(b.tasks||[]).filter(t=>t.id!==tid);
    renderTasks();toast('Görev silindi');
  }catch(e){toast(e.message,'err');}
}

let _persFilter='active'; // 'active'|'week'|'done'

async function renderPers(){

        </div>`).join('')}

async function submitMyTask(bid,tid,status){
  const t=_myTasks.find(x=>x.id===tid);if(!t)return;
  const fid=t.brief?.firmId||t.brief?.firm?.id;
  if(!fid){
    const b=firms.flatMap(f=>f.briefs||[]).find(b=>b.id===bid);
    const ff=b?gF(b.firmId):null;
    if(!ff){toast('Firma bilgisi eksik','err');return;}
    return _doMyTask(ff.id,bid,tid,t,status);
  }
  return _doMyTask(fid,bid,tid,t,status);
}
async function _doMyTask(fid,bid,tid,t,status){
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/tasks/${tid}`,{method:'PUT',body:{status}});
    Object.assign(t,updated);
    renderPers();
    toast(status==='DONE'?'Görev teslim edildi ✓':status==='DOING'?'Görev başlatıldı':'Güncellendi','ok');
  }catch(e){toast(e.message,'err');}
}

      `<button class="btn er" onclick="submitCustReject('${fid}','${bid}','${cid}')">✕ Reddet</button>`
    )}`);
}

async function submitCustReject(fid,bid,cid){
  const note=v('cr-note')||undefined;
  // First update card status to REJECTED
  await updateCard(fid,bid,'IG',cid,'REJECTED');
  // If note provided, add as a version note
  if(note){
    try{
      await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}/versions`,
        {method:'POST',body:{note:'Müşteri Notu: '+note}});
      const b=gB(fid,bid);
      if(b){const c=(b._igCards||[]).find(x=>x.id===cid);if(c){if(!c.versions)c.versions=[];c.versions.push({note:'Müşteri Notu: '+note,vNum:(c.versions.length+1),createdAt:new Date()});}}
    }catch{}
  }
  closeModal();renderCust();toast('İçerik reddedildi');
}

async function custApprove(fid,bid,cid,approve){
  const status=approve?'APPROVED':'REJECTED';
  if(!approve){openCustReject(fid,bid,cid);return;}
  await updateCard(fid,bid,'IG',cid,status);
  renderCust();
}

async function approveAllCards(fid,bid){
  const b=gB(fid,bid);if(!b)return;
  const pending=(b._igCards||[]).filter(c=>c.status==='REVIEW');
  if(!pending.length){toast('Onaylanacak kart yok','amb');return;}
  try{
    await Promise.all(pending.map(c=>api(`/api/firms/${fid}/briefs/${bid}/cards/${c.id}`,{method:'PUT',body:{status:'APPROVED'}})));
    pending.forEach(c=>c.status='APPROVED');
    renderCust();toast(`${pending.length} içerik onaylandı ✓`);
  }catch(e){toast(e.message,'err');}
}

async function submitIGCell(fid,bid,cellIndex){
  const type=v('ig-type')||'POST';
  const publishDate=v('ig-date')||undefined;
  const caption=v('ig-cap')||undefined;
  const videoUrl=v('ig-vurl')||undefined;
  const mediaUrl=v('ig-murl')||undefined;
  const hashtags=v('ig-hash')||undefined;
  try{
    const body={type,publishDate,caption,videoUrl,mediaUrl,hashtags};
    // If a specific cell index is known, use PUT with index
    let cell;
    if(cellIndex!=null&&!isNaN(cellIndex)){
      cell=await api(`/api/firms/${fid}/briefs/${bid}/ig/${cellIndex}`,{method:'PUT',body});
    }else{
      cell=await api(`/api/firms/${fid}/briefs/${bid}/ig`,{method:'POST',body});
    }
    const b=gB(fid,bid);
    if(b){
      if(!b.igCells)b.igCells=[];
      const idx=(b.igCells).findIndex(c=>c.id===cell.id);
      if(idx>=0)b.igCells[idx]=cell;else b.igCells.push(cell);
    }
    closeModal();renderIG();toast('İçerik eklendi ✓');
  }catch(e){toast(e.message,'err');}
}

async function renderTeam(){
  if(_me?.role!=='ADMIN'){document.getElementById('page-team').innerHTML='<div class="empty">Erişim yok</div>';return;}
  // Refresh members list
  await loadMembers();
  const el=document.getElementById('page-team');
  const roleMap={ADMIN:'Admin',EDITOR:'Editör',PROD:'Prodüksiyon',CLIENT:'Müşteri'};
  const roleClr={ADMIN:'b-blk',EDITOR:'b-wt',PROD:'b-ok',CLIENT:'b-gry'};
  const prodRoleMap={ART_DIRECTOR:'Art Director',COPYWRITER:'Copywriter',VIDEO_EDITOR:'Video Editor',
    SOCIAL_MEDIA:'Social Media',PHOTOGRAPHER:'Fotoğrafçı',STRATEGIST:'Stratejist'};

  // Group members by firm membership
  const memberFirms={};
  firms.forEach(f=>{
    (f.members||[]).forEach(m=>{
      if(!memberFirms[m.userId])memberFirms[m.userId]=[];
      memberFirms[m.userId].push(f.name);
    });
  });

  el.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:18px;font-weight:700">Ekip Yönetimi</div>
        <div style="font-size:12px;color:var(--t3)">${members.length} kayıtlı üye</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn outline xs" onclick="openAddMemberToFirmModal()">👥 Firmaya Üye Ekle</button>
        <button class="btn amber xs" onclick="openInviteModal()">+ Üye Davet Et</button>
      </div>
    </div>

    <!-- Per-firm team overview -->
    ${firms.length?`
    <div class="sec-hd" style="margin-bottom:12px"><div class="sec-ttl">Firma Ekipleri</div></div>
    <div class="card-grid card-grid-2" style="gap:14px;margin-bottom:24px">
      ${firms.map(f=>{
        const mems=(f.members||[]).map(m=>{
          const u=members.find(x=>x.id===m.userId)||{};
          return`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr)">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:50%;background:${f.color||'#534AB7'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0">${(u.name||u.email||'?')[0].toUpperCase()}</div>
              <div>
                <div style="font-size:12px;font-weight:500">${u.name||u.email||'—'}</div>
                <div style="font-size:10px;color:var(--t3)">${u.title||prodRoleMap[u.prodRole]||roleMap[u.role]||u.role||''}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="badge ${roleClr[u.role]||'b-gry'}">${roleMap[u.role]||u.role||'?'}</span>
              <button class="btn er xs ico" onclick="removeMember('${f.id}','${m.userId}')" title="Firmadan çıkar">✕</button>
            </div>
          </div>`;
        }).join('');
        return`<div class="card" style="padding:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:10px;height:10px;border-radius:50%;background:${f.color||'#534AB7'}"></span>
              <div style="font-weight:600;font-size:13px">${f.name}</div>
            </div>
            <button class="btn amber xs" onclick="openMemberModal('${f.id}')">+ Üye Ekle</button>
          </div>
          ${mems||'<div style="font-size:11px;color:var(--t3);padding:8px 0">Henüz üye yok</div>'}
        </div>`;
      }).join('')}
    </div>`:''}

    <!-- All users list -->
    <div class="sec-hd" style="margin-bottom:12px"><div class="sec-ttl">Tüm Kayıtlı Üyeler</div></div>
    <div class="card" style="padding:0;overflow:hidden">
      ${members.length?members.map(u=>{
        const firmNames=(memberFirms[u.id]||[]).join(', ')||'—';
        return`<div class="cell">
          <div style="width:34px;height:34px;border-radius:50%;background:var(--amb);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0">${(u.name||u.email||'?')[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:12px">${u.name||'—'}</div>
            <div style="font-size:11px;color:var(--t3)">${u.email||''} · ${u.title||prodRoleMap[u.prodRole]||''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span class="badge ${roleClr[u.role]||'b-gry'}">${roleMap[u.role]||u.role}</span>
            <span style="font-size:11px;color:var(--t3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${firmNames}">${firmNames}</span>
          </div>
        </div>`;
      }).join(''):`<div class="empty">Kayıtlı üye yok.</div>`}
    </div>`;
}

function openAddMemberToFirmModal(){
  const firmOpts=firms.map(f=>[f.id,f.name]);
  if(!firmOpts.length){toast('Önce firma ekleyin','err');return;}
  showModal(`${mHd('Firmaya Üye Ekle')}
    <div class="info wt"><span class="info-ico">ℹ</span><div>Mevcut kayıtlı kullanıcıyı e-posta adresiyle bir firmaya ekleyin.</div></div>
    ${fRow('Firma *',fSel('atf-firm',firmOpts))}
    ${fRow('E-posta *',fInp('atf-email','email','kullanici@ajans.com'))}
    ${mFt(
      `<button class="btn surface" onclick="closeModal()">İptal</button>`,
      `<button class="btn amber" onclick="submitAddToFirm()">Ekle</button>`
    )}`);
}

async function submitAddToFirm(){
  const fid=v('atf-firm');
  const email=v('atf-email');
  if(!fid||!email){toast('Firma ve e-posta gerekli','err');return;}
  try{
    const member=await api(`/api/firms/${fid}/members`,{method:'POST',body:{email}});
    const f=firms.find(x=>x.id===fid);
    if(f){if(!f.members)f.members=[];f.members.push(member);}
    closeModal();renderTeam();toast('Üye firmaya eklendi ✓');
  }catch(e){toast(e.message,'err');}
}

function openInviteModal(){
  // Admin can register a new user directly
  showModal(`${mHd('Yeni Üye Oluştur')}
    <div class="info ok"><span class="info-ico">ℹ</span><div>Yeni bir kullanıcı hesabı oluşturun. Kullanıcı bu bilgilerle giriş yapabilir.</div></div>
    <div class="fld-grid fld-grid-2">
      ${fRow('Ad Soyad *',fInp('inv-name','text','Ali Veli'))}
      ${fRow('E-posta *',fInp('inv-email','email','ali@ajans.com'))}
    </div>
    <div class="fld-grid fld-grid-2">
      ${fRow('Şifre *',fInp('inv-pass','password','min 8 karakter'))}
      ${fRow('Unvan',fInp('inv-title','text','Kreatif Direktör'))}
    </div>
    ${fRow('Rol *',fSel('inv-role',[['EDITOR','Editör'],['PROD','Prodüksiyon'],['CLIENT','Müşteri'],['ADMIN','Admin']]))}
    ${firms.length?fRow('Firmaya Ekle (isteğe bağlı)',fSel('inv-firm',[['','Seçme'],...firms.map(f=>[f.id,f.name])])):''}
    ${mFt(
      `<button class="btn surface" onclick="closeModal()">İptal</button>`,
      `<button class="btn amber" onclick="submitInvite()">Oluştur</button>`
    )}`);
}

async function submitInvite(){
  const name=v('inv-name'),email=v('inv-email');
  const password=document.getElementById('inv-pass')?.value;
  const title=v('inv-title')||undefined;
  const role=v('inv-role')||'EDITOR';
  const firmId=v('inv-firm')||null;
  if(!name||!email||!password){toast('Ad, e-posta ve şifre gerekli','err');return;}
  if(password.length<8){toast('Şifre en az 8 karakter olmalı','err');return;}
  try{
    // Register via auth/register (admin creates account)
    await api('/api/auth/register',{method:'POST',body:{name,email,password,role,title},noAuth:true});
    // If firm selected, add as member
    if(firmId){
      try{
        const member=await api(`/api/firms/${firmId}/members`,{method:'POST',body:{email}});
        const f=firms.find(x=>x.id===firmId);
        if(f){if(!f.members)f.members=[];f.members.push(member);}
      }catch{}
    }
    await loadMembers();
    closeModal();renderTeam();toast('Üye oluşturuldu ✓');
  }catch(e){toast(e.message,'err');}
}

// ── AUTH ──────────────────────────────────────────────────
function showLogin(){
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('reg-wrap').style.display='none';
  document.getElementById('app').style.display='none';
}
function showRegister(){
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('reg-wrap').style.display='flex';
}
function backToLogin(){
  document.getElementById('reg-wrap').style.display='none';
  document.getElementById('login-wrap').style.display='flex';
}

async function doLogin(){
  const email=v('li-email'),password=document.getElementById('li-pass')?.value;
  if(!email||!password){toast('E-posta ve şifre girin','err');return;}
  try{
    const data=await api('/api/auth/login',{method:'POST',body:{email,password},noAuth:true});
    _token=data.token;_me=data.user;
    localStorage.setItem('mk_token',_token);
    document.getElementById('login-wrap').style.display='none';
    await initApp();
  }catch(e){toast(e.message||'Giriş başarısız','err');}
}

async function doRegister(){
  const name=v('re-name'),email=v('re-email'),password=document.getElementById('re-pass')?.value;
  const role=v('re-role')||'EDITOR',title=v('re-title')||undefined;
  if(!name||!email||!password){toast('Ad, e-posta ve şifre gerekli','err');return;}
  if(password.length<8){toast('Şifre en az 8 karakter olmalı','err');return;}
  try{
    const data=await api('/api/auth/register',{method:'POST',body:{name,email,password,role,title},noAuth:true});
    _token=data.token;_me=data.user;
    localStorage.setItem('mk_token',_token);
    document.getElementById('reg-wrap').style.display='none';
    await initApp();
  }catch(e){toast(e.message||'Kayıt başarısız','err');}
}

async function doLogout(){
  try{await api('/api/auth/logout',{method:'POST'});}catch{}
  _token=null;_me=null;firms=[];members=[];_myTasks=[];_curFid=null;_curBid=null;
  localStorage.removeItem('mk_token');
  showLogin();
}

// ── SEARCH ────────────────────────────────────────────────
let _srTimer=null;
function onSearch(val){
  clearTimeout(_srTimer);
  const drop=document.getElementById('search-drop');
  if(!val||val.length<2){if(drop)drop.style.display='none';return;}
  _srTimer=setTimeout(async()=>{
    try{
      const res=await api(`/api/search?q=${encodeURIComponent(val)}`);
      if(!drop)return;
      let html='';
      const briefs=res.briefs||[];const cards=res.cards||[];const tasks=res.tasks||[];
      if(!briefs.length&&!cards.length&&!tasks.length){
        drop.innerHTML='<div style="padding:10px;font-size:11px;color:var(--t3)">Sonuç bulunamadı</div>';
        drop.style.display='block';return;
      }
      if(briefs.length){
        html+=`<div style="padding:4px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Brief</div>`;
        html+=briefs.slice(0,4).map(b=>`<div class="sr-item" onclick="nav('${b.firmId}','${b.id}','brief');closeSR()">${b.firm?.name||''} › ${b.month} ${b.year}</div>`).join('');
      }
      if(cards.length){
        html+=`<div style="padding:4px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Kart</div>`;
        html+=cards.slice(0,4).map(c=>`<div class="sr-item" onclick="nav('${c.brief?.firmId||''}','${c.briefId}','${c.which==='IG'?'mb':'mb-kamp'}');closeSR()">${c.label}</div>`).join('');
      }
      if(tasks.length){
        html+=`<div style="padding:4px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Görev</div>`;
        html+=tasks.slice(0,4).map(t=>`<div class="sr-item" onclick="nav('${t.brief?.firmId||''}','${t.briefId}','tasks');closeSR()">${t.desc||t.cardRef}</div>`).join('');
      }
      drop.innerHTML=html;drop.style.display='block';
    }catch{if(drop)drop.style.display='none';}
  },300);
}
function closeSR(){
  const drop=document.getElementById('search-drop');
  const inp=document.querySelector('.tb-search input');
  if(drop)drop.style.display='none';
  if(inp)inp.value='';
}
document.addEventListener('click',e=>{if(!e.target.closest('.tb-search'))closeSR();});

// ── WEBSOCKET ─────────────────────────────────────────────
function initWS(){
  if(!_token)return;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}?token=${_token}`);
  ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.notif||m.title)toast((m.notif||m).title||'Bildirim','amb');}catch{}};
  ws.onclose=()=>setTimeout(initWS,5000);
  ws.onerror=()=>ws.close();
}

// ── INIT APP ──────────────────────────────────────────────
async function initApp(){
  try{
    if(!_me)_me=await api('/api/auth/me');
  }catch{
    showLogin();return;
  }

  document.getElementById('app').style.display='flex';
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('reg-wrap').style.display='none';

  // Topbar
  const av=document.getElementById('tb-av');
  const nm=document.getElementById('tb-nm');
  const rl=document.getElementById('tb-role');
  if(av)av.textContent=(_me.name||_me.email||'?')[0].toUpperCase();
  if(nm)nm.textContent=_me.name||_me.email||'—';
  if(rl){
    const rlMap={ADMIN:'Admin',EDITOR:'Editör',PROD:'Prodüksiyon',CLIENT:'Müşteri'};
    rl.textContent=rlMap[_me.role]||_me.role;
  }

  // CLIENT role: show portal link
  const custLnk=document.getElementById('si-cust');
  if(custLnk)custLnk.style.display=_me.role==='CLIENT'?'flex':'none';
  // ADMIN: show team management link
  const teamLnk=document.getElementById('si-team');
  if(teamLnk)teamLnk.style.display=_me.role==='ADMIN'?'flex':'none';
  // Non-admin: hide firm add button
  const addFirm=document.getElementById('sb-add-firm');
  if(addFirm)addFirm.style.display=_me.role==='ADMIN'?'':'none';

  try{
    await Promise.all([loadMembers(),loadFirms()]);
    await Promise.all(firms.map(f=>loadBriefs(f.id)));
  }catch(e){console.error('Load error',e);}

  renderSB();

  if(_me.role==='CLIENT'){
    // Find first firm the client belongs to
    const myFirm=firms.find(f=>(f.members||[]).some(m=>m.userId===_me.id));
    const myBrief=myFirm?.briefs?.[0];
    if(myFirm&&myBrief){nav(myFirm.id,myBrief.id,'cust');}
    else go('home');
  }else{
    go('home');
  }

  initWS();
}

// Enter key support for login
document.getElementById('li-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('li-email')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('li-pass')?.focus();});

// ── BOOTSTRAP ─────────────────────────────────────────────
if(_token){
  initApp();
}else{
  showLogin();
}
</script>
