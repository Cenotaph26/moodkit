<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoodKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root{
  --bg:#f5f3ee; --blk:#1a1a18; --amb:#c8a96e;
  --gry:#8a857c; --gry1:#ede9e0; --gry2:#d8d4ca;
  --t1:#1a1a18; --t2:#3d3c38; --t3:#8a857c;
  --bdr:#e0dbd0;
  --ok:#2d7a4f; --ok2:#d4edda;
  --wt:#c8a96e; --wt2:#fff3cd;
  --er:#8b1a1a; --er2:#f8d7da;
  --rv:#1a4f8b; --rv2:#cce5ff;
  --r:8px; --r2:12px; --sh:0 2px 12px rgba(0,0,0,.08);
  --tr:160ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;font-size:13px;background:var(--bg);color:var(--t1);line-height:1.5;overflow:hidden;height:100vh}

/* ── APP SHELL ───────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tb{height:52px;background:#fff;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;z-index:100}
.layout{display:flex;flex:1;min-height:0;overflow:hidden}
.sb{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.cnt{flex:1;min-height:0;overflow-y:auto;padding:24px}
.page{display:none}.page.on{display:block}

/* ── TOPBAR ──────────────────────────────────────────────── */
.tb-logo{font-weight:700;font-size:15px;letter-spacing:-.5px;color:var(--blk);white-space:nowrap}
.tb-logo span{color:var(--amb)}
.tb-bc{font-size:11px;color:var(--t3);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-search{position:relative;flex:0 0 200px}
.tb-search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--bdr);border-radius:var(--r);font-size:12px;background:var(--gry1);color:var(--t1);outline:none}
.tb-search input:focus{border-color:var(--amb);background:#fff}
.tb-search::before{content:'⌕';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:14px;pointer-events:none}
#search-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);z-index:200;display:none;max-height:280px;overflow-y:auto}
.sr-item{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr)}
.sr-item:last-child{border:none}.sr-item:hover{background:var(--gry1)}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--amb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;cursor:pointer;flex-shrink:0}
.tb-info{display:flex;flex-direction:column;line-height:1.2}
.tb-nm{font-size:12px;font-weight:600}
.tb-role-badge{font-size:10px;color:var(--t3)}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sb-top{padding:12px;border-bottom:1px solid var(--bdr);display:flex;gap:6px}
.sb-nav{padding:8px 0;border-bottom:1px solid var(--bdr)}
.sb-lnk{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;color:var(--t2);cursor:pointer;border-radius:0;transition:background var(--tr)}
.sb-lnk:hover{background:var(--gry1)}.sb-lnk.on{background:var(--gry1);color:var(--blk);font-weight:600}
.sb-lnk .ico{font-size:14px;width:18px;text-align:center}
.firms-list{flex:1;overflow-y:auto}
.firm-row{padding:0}
.firm-hd{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:500;transition:background var(--tr)}
.firm-hd:hover{background:var(--gry1)}
.firm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.firm-ch{margin-left:auto;font-size:10px;color:var(--t3);transition:transform var(--tr)}
.firm-row.open .firm-ch{transform:rotate(90deg)}
.acc-body{display:none;padding-left:28px;padding-bottom:4px}
.firm-row.open .acc-body{display:block}
.sub-lnk{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;color:var(--t3);cursor:pointer;border-radius:var(--r);transition:background var(--tr)}
.sub-lnk:hover{background:var(--gry1);color:var(--t1)}.sub-lnk.on{color:var(--blk);font-weight:600}
.sub-lnk .stage-dot{width:6px;height:6px;border-radius:50%;background:var(--gry2);flex-shrink:0}
.sub-lnk.on .stage-dot{background:var(--amb)}
.sb-add{padding:10px 12px;border-top:1px solid var(--bdr)}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all var(--tr);white-space:nowrap;font-family:inherit}
.btn:disabled{opacity:.5;cursor:default}
.btn.solid{background:var(--blk);color:#fff}.btn.solid:hover{background:#333}
.btn.amber{background:var(--amb);color:#fff}.btn.amber:hover{background:#b8964f}
.btn.outline{background:transparent;color:var(--t1);border:1px solid var(--bdr)}.btn.outline:hover{background:var(--gry1)}
.btn.surface{background:var(--gry2);color:var(--t1)}.btn.surface:hover{background:var(--gry)}
.btn.ok{background:var(--ok2);color:var(--ok);border:1px solid var(--ok)}.btn.ok:hover{background:var(--ok);color:#fff}
.btn.er{background:var(--er2);color:var(--er);border:1px solid var(--er)}.btn.er:hover{background:var(--er);color:#fff}
.btn.xs{padding:4px 8px;font-size:11px}.btn.sm{padding:5px 10px;font-size:11px}.btn.lg{padding:10px 20px;font-size:14px}
.btn.ico{padding:6px;border-radius:var(--r)}.btn.xs.ico{padding:4px}

/* ── BADGES ──────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok2);color:var(--ok)}.b-rv{background:var(--rv2);color:var(--rv)}
.b-wt{background:var(--wt2);color:#7a5c00}.b-er{background:var(--er2);color:var(--er)}
.b-blk{background:var(--blk);color:#fff}.b-amb{background:var(--amb);color:#fff}
.b-gry{background:var(--gry2);color:var(--t2)}

/* ── FORMS ───────────────────────────────────────────────── */
.fld{padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--r);font-size:12px;font-family:inherit;color:var(--t1);background:#fff;width:100%;outline:none;transition:border var(--tr)}
.fld:focus{border-color:var(--amb)}.fld::placeholder{color:var(--t3)}
textarea.fld{min-height:80px;resize:vertical}
.fld-row{margin-bottom:12px}.fld-row label{font-size:11px;color:var(--t3);font-weight:500;display:block;margin-bottom:4px}
.fld-grid{display:grid;gap:12px}.fld-grid-2{grid-template-columns:1fr 1fr}

/* ── STAGE PILLS ─────────────────────────────────────────── */
.stage-bar{display:flex;gap:0;margin-bottom:24px;background:var(--gry1);border-radius:var(--r2);padding:3px}
.stage-pill{flex:1;padding:7px 8px;border-radius:8px;text-align:center;font-size:11px;font-weight:500;color:var(--t3);cursor:pointer;transition:all var(--tr);white-space:nowrap;position:relative}
.stage-pill.done{color:var(--ok)}.stage-pill.done::after{content:'✓';margin-left:4px}
.stage-pill.active{background:#fff;color:var(--blk);box-shadow:var(--sh);font-weight:600}
.stage-pill.todo{color:var(--gry2)}

/* ── CARDS ───────────────────────────────────────────────── */
.card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:16px}
.card-grid{display:grid;gap:16px}
.card-grid-2{grid-template-columns:1fr 1fr}
.card-grid-3{grid-template-columns:1fr 1fr 1fr}
.card-grid-4{grid-template-columns:repeat(4,1fr)}

/* ── MOODBOARD CARDS ─────────────────────────────────────── */
.mb-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;position:relative;cursor:pointer;transition:box-shadow var(--tr)}
.mb-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12)}
.mb-card[data-s="PENDING"]{border-left:3px solid var(--gry2)}
.mb-card[data-s="REVIEW"]{border-left:3px solid var(--rv)}
.mb-card[data-s="APPROVED"]{border-left:3px solid var(--ok)}
.mb-card[data-s="REJECTED"]{border-left:3px solid var(--er)}
.mb-thumb{width:100%;height:140px;object-fit:cover;display:block;background:var(--gry1)}
.mb-thumb-ph{width:100%;height:140px;background:var(--gry1);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gry2)}
.mb-body{padding:10px}
.mb-label{font-size:12px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-meta{font-size:10px;color:var(--t3);display:flex;align-items:center;justify-content:space-between}
.mb-actions{padding:8px;border-top:1px solid var(--bdr);display:flex;gap:6px;justify-content:flex-end}

/* ── KANBAN ──────────────────────────────────────────────── */
.kb-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kb-col{background:var(--gry1);border-radius:var(--r2);padding:12px}
.kb-col-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kb-col-ttl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--t3)}
.kb-cnt{font-size:11px;background:#fff;border-radius:999px;padding:1px 7px;color:var(--t2);font-weight:600}
.tc{background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:10px;margin-bottom:8px;cursor:grab}
.tc:last-child{margin-bottom:0}
.tc-ref{font-size:11px;color:var(--t3);margin-bottom:4px}
.tc-title{font-size:12px;font-weight:600;margin-bottom:6px}
.tc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-actions{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
.tc.drg{opacity:.4;box-shadow:0 0 0 2px var(--amb)}

/* ── IG GRID ─────────────────────────────────────────────── */
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.igcell{aspect-ratio:1;background:var(--gry1);position:relative;overflow:hidden;cursor:pointer}
.igcell img,.igcell video{width:100%;height:100%;object-fit:cover;display:block}
.igcell-ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transition:opacity var(--tr)}
.igcell:hover .igcell-ov{opacity:1}
.igcell-idx{position:absolute;top:4px;left:5px;font-size:10px;font-weight:700;color:#fff;opacity:.7}
.igcell-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:22px;color:var(--gry2);gap:4px}
.igcell-ph span{font-size:10px;color:var(--t3)}

/* ── IG PHONE ────────────────────────────────────────────── */
.ig-phone{width:184px;flex-shrink:0;background:#fff;border:1px solid var(--bdr);border-radius:20px;overflow:hidden;padding:8px}
.ig-ph-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ig-ph-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;object-fit:cover}
.ig-ph-nm{font-size:10px;font-weight:600}
.ig-ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.ig-ph-cell{aspect-ratio:1;background:var(--gry1);overflow:hidden}
.ig-ph-cell img{width:100%;height:100%;object-fit:cover}

/* ── STAT CARD ───────────────────────────────────────────── */
.stat-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:16px}
.stat-num{font-size:28px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:4px}

/* ── MODAL ───────────────────────────────────────────────── */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;padding:16px}
#modal-box{background:#fff;border-radius:var(--r2);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18);transform:translateY(8px);opacity:0;transition:all var(--tr)}
#modal-box.open{transform:none;opacity:1}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-ttl{font-size:15px;font-weight:600}
.modal-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr)}

/* ── TOAST ───────────────────────────────────────────────── */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:600;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast-msg{padding:10px 16px;border-radius:var(--r);font-size:12px;font-weight:500;box-shadow:var(--sh);animation:tin .2s ease;max-width:300px}
.toast-msg.ok{background:var(--blk);color:#fff}
.toast-msg.err{background:var(--er);color:#fff}
.toast-msg.amb{background:var(--amb);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── LOGIN / REGISTER ────────────────────────────────────── */
.auth-wrap{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;align-items:center;justify-content:center}
.auth-box{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:32px;width:360px;box-shadow:var(--sh)}
.auth-logo{font-size:22px;font-weight:700;margin-bottom:24px;text-align:center}
.auth-logo span{color:var(--amb)}

/* ── SECTION HEADER ──────────────────────────────────────── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-ttl{font-size:14px;font-weight:600}

/* ── PROGRESS ────────────────────────────────────────────── */
.prog-bar{background:var(--gry1);border-radius:999px;height:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;background:var(--amb);transition:width .3s ease}

/* ── INFO BLOCK ──────────────────────────────────────────── */
.info-block{background:var(--gry1);border-radius:var(--r2);padding:16px;font-size:12px;color:var(--t2)}
.info-block strong{color:var(--t1)}

/* ── PRINT ───────────────────────────────────────────────── */
@media print{.tb,.sb,#modal-bg,#toast-wrap,.btn,.sb-add{display:none!important}.cnt{padding:0}.app{height:auto;overflow:visible}.layout{overflow:visible}.cnt{overflow:visible}}

/* ── MISC ────────────────────────────────────────────────── */
.sep{height:1px;background:var(--bdr);margin:16px 0}
.empty{padding:32px;text-align:center;color:var(--t3);font-size:12px}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:500;background:var(--gry1);color:var(--t2);border:1px solid var(--bdr);cursor:pointer;transition:all var(--tr)}
.chip.on{background:var(--blk);color:#fff;border-color:var(--blk)}
.det-wrap{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:start}
.det-panel{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;position:sticky;top:0}
</style>
</head>
<body>

<!-- AUTH OVERLAYS -->
<div id="login-wrap" class="auth-wrap" style="display:flex">
  <div class="auth-box">
    <div class="auth-logo">Mood<span>Kit</span></div>
    <div class="fld-row"><label>E-posta</label><input id="li-email" type="email" class="fld" placeholder="ad@ajans.com" autocomplete="email"></div>
    <div class="fld-row"><label>Şifre</label><input id="li-pass" type="password" class="fld" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn amber lg" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">Giriş Yap</button>
    <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--t3)">Hesabın yok mu? <span style="color:var(--amb);cursor:pointer;font-weight:500" onclick="showRegister()">Kayıt ol</span></div>
  </div>
</div>

<div id="reg-wrap" class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">Mood<span>Kit</span></div>
    <div class="fld-grid fld-grid-2" style="margin-bottom:0">
      <div class="fld-row"><label>Ad Soyad</label><input id="re-name" type="text" class="fld" placeholder="Ali Veli"></div>
      <div class="fld-row"><label>E-posta</label><input id="re-email" type="email" class="fld" placeholder="ali@ajans.com"></div>
    </div>
    <div class="fld-grid fld-grid-2" style="margin-bottom:0">
      <div class="fld-row"><label>Şifre</label><input id="re-pass" type="password" class="fld" placeholder="min 8 karakter"></div>
      <div class="fld-row"><label>Unvan</label><input id="re-title" type="text" class="fld" placeholder="Kreatif Direktör"></div>
    </div>
    <div class="fld-row"><label>Rol</label>
      <select id="re-role" class="fld">
        <option value="EDITOR">Editör (Kreatif Ekip)</option>
        <option value="PROD">Prodüksiyon</option>
        <option value="CLIENT">Müşteri</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>
    <button class="btn amber lg" style="width:100%;justify-content:center" onclick="doRegister()">Kayıt Ol</button>
    <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--t3)">Hesabın var mı? <span style="color:var(--amb);cursor:pointer;font-weight:500" onclick="backToLogin()">Giriş yap</span></div>
  </div>
</div>

<!-- APP SHELL -->
<div class="app" id="app" style="display:none">
  <!-- TOPBAR -->
  <div class="tb">
    <div class="tb-logo">Mood<span>Kit</span></div>
    <div class="tb-bc" id="bc">Ana Sayfa</div>
    <div class="tb-search">
      <input type="text" placeholder="Ara..." oninput="onSearch(this.value)" autocomplete="off">
      <div id="search-drop"></div>
    </div>
    <div class="tb-av" id="tb-av" title="Profil" onclick="doLogout()">?</div>
    <div class="tb-info">
      <div class="tb-nm" id="tb-nm">—</div>
      <div class="tb-role-badge" id="tb-role">—</div>
    </div>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sb">
      <div class="sb-nav">
        <div class="sb-lnk on" id="si-home" onclick="go('home')"><span class="ico">⌂</span>Ana Sayfa</div>
        <div class="sb-lnk" id="si-pers" onclick="go('pers')"><span class="ico">✓</span>Görevlerim</div>
        <div class="sb-lnk" id="si-cust" onclick="go('cust')" style="display:none"><span class="ico">👁</span>Müşteri Portalı</div>
      </div>
      <div class="firms-list" id="flist"></div>
      <div class="sb-add">
        <button class="btn outline xs" style="width:100%;justify-content:center" id="sb-add-firm" onclick="openFirmModal()">+ Firma Ekle</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="cnt" id="cnt">

      <!-- PAGE: HOME -->
      <div class="page on" id="page-home"></div>

      <!-- PAGE: BRIEF -->
      <div class="page" id="page-brief"></div>

      <!-- PAGE: IG MOODBOARD -->
      <div class="page" id="page-mb"></div>

      <!-- PAGE: KAMPANYA MOODBOARD -->
      <div class="page" id="page-mb-kamp"></div>

      <!-- PAGE: IG GRID -->
      <div class="page" id="page-ig"></div>

      <!-- PAGE: TASKS -->
      <div class="page" id="page-tasks"></div>

      <!-- PAGE: PERSONEL -->
      <div class="page" id="page-pers"></div>

      <!-- PAGE: MÜŞTERI -->
      <div class="page" id="page-cust"></div>

      <!-- PAGE: YAYIN -->
      <div class="page" id="page-yayin"></div>

    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div id="modal-box"></div>
</div>

<!-- TOASTS -->
<div id="toast-wrap"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const STAGE_PAGES={BRIEF:'brief',MB_IG:'mb',MB_KAMP:'mb-kamp',TASKS:'tasks',YAYIN:'yayin'};
const PAGE_STAGES={'brief':'BRIEF','mb':'MB_IG','mb-kamp':'MB_KAMP','tasks':'TASKS','yayin':'YAYIN'};
const STAGE_ORDER=['brief','mb','mb-kamp','tasks','yayin'];
const STAGE_LABELS={brief:'Brief',mb:'IG Moodboard','mb-kamp':'Kampanya MB',tasks:'Görevler',yayin:'Yayın'};
const STATUS_CLS={PENDING:'b-gry',REVIEW:'b-rv',APPROVED:'b-ok',REJECTED:'b-er'};
const STATUS_LBL={PENDING:'Bekliyor',REVIEW:'İncelemede',APPROVED:'Onaylandı',REJECTED:'Reddedildi'};

// ── STATE ─────────────────────────────────────────────────
let _me=null, _token=localStorage.getItem('mk_token');
let firms=[], members=[], _myTasks=[];
let _curFid=null, _curBid=null, _curPage='home';

// ── API ───────────────────────────────────────────────────
async function api(path,opts={}){
  const {noAuth,body,method,...rest}=opts;
  const headers={'Content-Type':'application/json'};
  if(!noAuth&&_token) headers['Authorization']='Bearer '+_token;
  const r=await fetch(path,{method:method||'GET',headers,credentials:'include',...rest,
    body:body?JSON.stringify(body):undefined});
  if(r.status===401&&!noAuth){showLogin();throw new Error('Oturum süresi doldu');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||r.statusText);
  return d;
}

const gF=id=>firms.find(f=>f.id===id);
const gB=(fid,bid)=>gF(fid)?.briefs?.find(b=>b.id===bid);

function ytThumb(u){
  if(!u)return null;
  const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m?`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`:null;
}
function toEmbed(u){
  if(!u)return null;
  if(u.includes('/embed/'))return u;
  const m=u.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if(m)return`https://www.youtube.com/embed/${m[1]}?rel=0`;
  if(u.includes('vimeo.com/')){const id=u.split('vimeo.com/')[1]?.split('?')[0];return`https://player.vimeo.com/video/${id}`;}
  return null;
}
function fmtDate(d){
  if(!d)return'—';
  try{return new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'});}
  catch{return String(d).slice(0,10);}
}
function briefTitle(b){return`${MONTHS[(parseInt(b.month)||1)-1]||b.month} ${b.year}`;}

function toast(msg,type='ok'){
  const w=document.getElementById('toast-wrap');if(!w)return;
  const el=document.createElement('div');
  el.className='toast-msg '+(type==='err'?'err':type==='amb'?'amb':'ok');
  el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3200);
}

// ── MODAL ─────────────────────────────────────────────────
function showModal(html){
  const box=document.getElementById('modal-box');
  const bg=document.getElementById('modal-bg');
  box.innerHTML=html;bg.style.display='flex';
  requestAnimationFrame(()=>box.classList.add('open'));
}
function closeModal(){
  const box=document.getElementById('modal-box');
  box.classList.remove('open');
  setTimeout(()=>{document.getElementById('modal-bg').style.display='none';box.innerHTML='';},160);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function mHd(title){
  return`<div class="modal-hd"><div class="modal-ttl">${title}</div><button class="btn surface xs ico" onclick="closeModal()">✕</button></div>`;
}
function mFt(...btns){return`<div class="modal-ft">${btns.join('')}</div>`;}
function fRow(label,input){return`<div class="fld-row"><label>${label}</label>${input}</div>`;}
function fInp(id,type,ph,val=''){return`<input id="${id}" type="${type}" placeholder="${ph}" value="${val||''}" class="fld">`;}
function fSel(id,opts,cur=''){return`<select id="${id}" class="fld">${opts.map(([v,l])=>`<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('')}</select>`;}
function fTa(id,ph,val=''){return`<textarea id="${id}" placeholder="${ph}" class="fld">${val||''}</textarea>`;}
function v(id){return document.getElementById(id)?.value?.trim()||'';}
function vb(id){const el=document.getElementById(id);return el?el.checked:false;}

// ── NAVIGATION ────────────────────────────────────────────
function go(page){
  _curPage=page;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  const pg=document.getElementById('page-'+page);
  if(pg)pg.classList.add('on');

  // Topbar breadcrumb
  const bcEl=document.getElementById('bc');
  if(bcEl){
    const f=gF(_curFid),b=gB(_curFid,_curBid);
    const parts=[];
    if(f)parts.push(f.name);
    if(b)parts.push(briefTitle(b));
    parts.push(STAGE_LABELS[page]||page);
    bcEl.textContent=parts.join(' › ');
  }

  // Sidebar active links
  ['home','pers','cust'].forEach(id=>{
    const el=document.getElementById('si-'+id);
    if(el)el.classList.toggle('on',page===id);
  });
  document.querySelectorAll('.sub-lnk').forEach(el=>{
    el.classList.toggle('on',el.dataset.page===page&&el.dataset.fid===_curFid&&el.dataset.bid===_curBid);
  });

  // Render the page
  const renders={home:renderHome,brief:renderBrief,mb:renderMB,'mb-kamp':renderMBKamp,
    ig:renderIG,tasks:renderTasks,pers:renderPers,cust:renderCust,yayin:renderYayin};
  if(renders[page])renders[page]();
}

function nav(fid,bid,page){
  _curFid=fid;_curBid=bid;
  // Open firm accordion
  document.querySelectorAll('.firm-row').forEach(el=>{
    el.classList.toggle('open',el.dataset.fid===fid);
  });
  go(page);
}

  if(!firms.length){el.innerHTML='<div class="empty" style="font-size:11px">Firma yok</div>';return;}

      <div class="firm-hd" onclick="toggleFirm('${f.id}')">

async function saveBrief(fid,bid){
  const chips=[...document.querySelectorAll('.chip.on')].map(el=>el.dataset.val);
  const body={
    products:v('bf-products')||undefined,
    newProduct:document.getElementById('bf-newProduct')?.checked||false,
    newProductDesc:v('bf-newProductDesc')||undefined,
    featured:v('bf-featured')||undefined,
    tone:v('bf-tone')||undefined,
    colorDir:v('bf-colorDir')||undefined,
    avoid:v('bf-avoid')||undefined,
    refs:v('bf-refs')||undefined,
    budget:v('bf-budget')||undefined,
    platforms:chips,
    targetAudience:v('bf-audience')||undefined,
    adAreas:v('bf-adAreas')||undefined,
    specialDay:v('bf-specialDay')||undefined,
    specialContent:v('bf-specialContent')||undefined,
    notes:v('bf-notes')||undefined,
  };
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}`,{method:'PUT',body});
    const b=gB(fid,bid);if(b)Object.assign(b,updated);
    toast('Brief kaydedildi ✓');
  }catch(e){toast(e.message,'err');}
}

// ── CARD ACTIONS ──────────────────────────────────────────
async function updateCard(fid,bid,which,cid,status){
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}`,{method:'PUT',body:{status}});
    const b=gB(fid,bid);
    if(b){
      const arr=which==='IG'?(b._igCards||[]):(b._kampCards||[]);
      const idx=arr.findIndex(c=>c.id===cid);
      if(idx>=0)Object.assign(arr[idx],updated);
    }
    if(which==='IG')renderMB();else renderMBKamp();
    toast(status==='APPROVED'?'Onaylandı ✓':'Reddedildi','ok');
  }catch(e){toast(e.message,'err');}
}

async function deleteCard(fid,bid,which,cid){
  if(!confirm('Kartı silmek istediğinize emin misiniz?'))return;
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}`,{method:'DELETE'});
    const b=gB(fid,bid);
    if(b){
      if(which==='IG')b._igCards=(b._igCards||[]).filter(c=>c.id!==cid);
      else b._kampCards=(b._kampCards||[]).filter(c=>c.id!==cid);
    }
    if(which==='IG')renderMB();else renderMBKamp();
    toast('Kart silindi');
  }catch(e){toast(e.message,'err');}
}

async function saveCardStatus(fid,bid,which,cid){
  const status=v('cd-status');
  if(!status)return;
  await updateCard(fid,bid,which,cid,status);
  closeModal();
}

async function addCardVersion(fid,bid,cid){
  const note=v('cd-vnote');
  const videoUrl=v('cd-vurl')||undefined;
  const mediaUrl=v('cd-vimg')||undefined;
  if(!note){toast('Versiyon notu gerekli','err');return;}
  try{
    const ver=await api(`/api/firms/${fid}/briefs/${bid}/cards/${cid}/versions`,
      {method:'POST',body:{note,videoUrl,mediaUrl}});
    // Reload card versions
    const b=gB(fid,bid);
    if(b){
      const allArr=[...(b._igCards||[]),...(b._kampCards||[])];
      const c=allArr.find(x=>x.id===cid);
      if(c){if(!c.versions)c.versions=[];c.versions.unshift(ver);}
    }
    toast('Versiyon eklendi ✓');closeModal();
  }catch(e){toast(e.message,'err');}
}

async function renderTasks(){

  const stgIdx=STAGE_ORDER.indexOf(STAGE_PAGES[b.stage]||'brief');

  const kanban=cols.map(status=>{

    return`<div class="kb-col">

        <div style="display:flex;align-items:center;gap:6px">
          <span style="width:8px;height:8px;border-radius:50%;background:${colColors[status]}"></span>
          <span class="kb-col-ttl">${colLabels[status]}</span>
        </div>
        <span class="kb-cnt">${colTasks.length}</span>
      </div>
      ${colTasks.map(t=>{
        const assignee=mem.find(m=>m.id===t.assigneeId)||t.assignee;
        return`<div class="tc">
          <div class="tc-ref">${t.type} ${t.cardRef?'· '+t.cardRef:''}</div>

async function cycleTask(fid,bid,tid){
  const b=gB(fid,bid);if(!b)return;
  const t=(b.tasks||[]).find(x=>x.id===tid);if(!t)return;
  const next={TODO:'DOING',DOING:'DONE',DONE:'TODO'}[t.status];
  try{
    const updated=await api(`/api/firms/${fid}/briefs/${bid}/tasks/${tid}`,{method:'PUT',body:{status:next}});
    Object.assign(t,updated);
    renderTasks();toast(`${next==='TODO'?'Sıfırlandı':next==='DOING'?'Başlandı':'Tamamlandı'} ✓`);
  }catch(e){toast(e.message,'err');}
}

async function deleteTask(fid,bid,tid){
  if(!confirm('Görevi silmek istiyor musunuz?'))return;
  try{
    await api(`/api/firms/${fid}/briefs/${bid}/tasks/${tid}`,{method:'DELETE'});
    const b=gB(fid,bid);
    if(b)b.tasks=(b.tasks||[]).filter(t=>t.id!==tid);
    renderTasks();toast('Görev silindi');
  }catch(e){toast(e.message,'err');}
}

    catch{b._igCards=[];}
  }
  const cards=(b._igCards||[]).filter(c=>c.status==='REVIEW'||c.status==='APPROVED'||c.status==='REJECTED');
  const stsCls={PENDING:'b-gry',REVIEW:'b-rv',APPROVED:'b-ok',REJECTED:'b-er'};
  const stsLbl={PENDING:'Bekliyor',REVIEW:'İncelemede',APPROVED:'Onaylandı',REJECTED:'Reddedildi'};

  document.getElementById('page-cust').innerHTML=`
    <div style="background:${f.color||'#534AB7'};border-radius:var(--r2);padding:20px;color:#fff;margin-bottom:20px">
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">${f.name}</div>
      <div style="font-size:13px;opacity:.8">${briefTitle(b)} · Müşteri Onay Paneli</div>
    </div>
    ${cards.length?`
      <div class="sec-hd">
        <div class="sec-ttl">Onay Bekleyen İçerikler (${cards.filter(c=>c.status==='REVIEW').length})</div>
        <button class="btn ok xs" onclick="approveAllCards('${f.id}','${b.id}')">✓ Tümünü Onayla</button>
      </div>
      <div class="card-grid card-grid-3" style="gap:16px">
        ${cards.map(c=>{
          const v0=c.versions?.[0];
          const thumb=v0?.mediaUrl||(v0?.videoUrl?ytThumb(v0.videoUrl):null);
          return`<div class="mb-card" data-s="${c.status}">
            ${thumb?`<img class="mb-thumb" src="${thumb}" onerror="this.style.display='none'">`:
              `<div class="mb-thumb-ph">🎨</div>`}
            <div class="mb-body">
              <div class="mb-label">${c.label}</div>
              <div class="mb-meta">
                <span style="font-size:10px;color:var(--t3)">${c.type}</span>
                <span class="badge ${stsCls[c.status]||'b-gry'}">${stsLbl[c.status]||c.status}</span>
              </div>
            </div>
            ${c.status==='REVIEW'?`<div class="mb-actions">
              <button class="btn ok xs" onclick="custApprove('${f.id}','${b.id}','${c.id}',true)">✓ Onayla</button>
              <button class="btn er xs" onclick="custApprove('${f.id}','${b.id}','${c.id}',false)">✕ Reddet</button>
            </div>`:''}
          </div>`;
        }).join('')}
      </div>`:`<div class="empty">İncelemeniz için içerik yok.</div>`}`;
}

async function custApprove(fid,bid,cid,approve){
  const status=approve?'APPROVED':'REJECTED';
  await updateCard(fid,bid,'IG',cid,status);
  renderCust();
}

async function approveAllCards(fid,bid){
  const b=gB(fid,bid);if(!b)return;
  const pending=(b._igCards||[]).filter(c=>c.status==='REVIEW');
  if(!pending.length){toast('Onaylanacak kart yok','amb');return;}
  try{
    await Promise.all(pending.map(c=>api(`/api/firms/${fid}/briefs/${bid}/cards/${c.id}`,{method:'PUT',body:{status:'APPROVED'}})));
    pending.forEach(c=>c.status='APPROVED');
    renderCust();toast(`${pending.length} içerik onaylandı ✓`);
  }catch(e){toast(e.message,'err');}
}

async function submitIGCell(fid,bid,cellIndex){
  const type=v('ig-type')||'POST';
  const publishDate=v('ig-date')||undefined;
  const caption=v('ig-cap')||undefined;
  const videoUrl=v('ig-vurl')||undefined;
  const mediaUrl=v('ig-murl')||undefined;
  const hashtags=v('ig-hash')||undefined;
  try{
    const body={type,publishDate,caption,videoUrl,mediaUrl,hashtags};
    // If a specific cell index is known, use PUT with index
    let cell;
    if(cellIndex!=null&&!isNaN(cellIndex)){
      cell=await api(`/api/firms/${fid}/briefs/${bid}/ig/${cellIndex}`,{method:'PUT',body});
    }else{
      cell=await api(`/api/firms/${fid}/briefs/${bid}/ig`,{method:'POST',body});
    }
    const b=gB(fid,bid);
    if(b){
      if(!b.igCells)b.igCells=[];
      const idx=(b.igCells).findIndex(c=>c.id===cell.id);
      if(idx>=0)b.igCells[idx]=cell;else b.igCells.push(cell);
    }
    closeModal();renderIG();toast('İçerik eklendi ✓');
  }catch(e){toast(e.message,'err');}
}

    closeModal();openMemberModal(fid);toast('Üye çıkarıldı');

function showLogin(){
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('reg-wrap').style.display='none';
  document.getElementById('app').style.display='none';
}
function showRegister(){
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('reg-wrap').style.display='flex';
}
function backToLogin(){
  document.getElementById('reg-wrap').style.display='none';
  document.getElementById('login-wrap').style.display='flex';
}

async function doLogin(){
  const email=v('li-email'),password=document.getElementById('li-pass')?.value;
  if(!email||!password){toast('E-posta ve şifre girin','err');return;}
  try{
    const data=await api('/api/auth/login',{method:'POST',body:{email,password},noAuth:true});
    _token=data.token;_me=data.user;
    localStorage.setItem('mk_token',_token);
    document.getElementById('login-wrap').style.display='none';
    await initApp();
  }catch(e){toast(e.message||'Giriş başarısız','err');}
}

async function doRegister(){
  const name=v('re-name'),email=v('re-email'),password=document.getElementById('re-pass')?.value;
  const role=v('re-role')||'EDITOR',title=v('re-title')||undefined;
  if(!name||!email||!password){toast('Ad, e-posta ve şifre gerekli','err');return;}
  if(password.length<8){toast('Şifre en az 8 karakter olmalı','err');return;}
  try{
    const data=await api('/api/auth/register',{method:'POST',body:{name,email,password,role,title},noAuth:true});
    _token=data.token;_me=data.user;
    localStorage.setItem('mk_token',_token);
    document.getElementById('reg-wrap').style.display='none';
    await initApp();
  }catch(e){toast(e.message||'Kayıt başarısız','err');}
}

async function doLogout(){
  try{await api('/api/auth/logout',{method:'POST'});}catch{}
  _token=null;_me=null;firms=[];members=[];_myTasks=[];_curFid=null;_curBid=null;
  localStorage.removeItem('mk_token');
  showLogin();
}

// ── SEARCH ────────────────────────────────────────────────
let _srTimer=null;
function onSearch(val){
  clearTimeout(_srTimer);
  const drop=document.getElementById('search-drop');
  if(!val||val.length<2){if(drop)drop.style.display='none';return;}
  _srTimer=setTimeout(async()=>{
    try{
      const res=await api(`/api/search?q=${encodeURIComponent(val)}`);
      if(!drop)return;
      let html='';
      const briefs=res.briefs||[];const cards=res.cards||[];const tasks=res.tasks||[];
      if(!briefs.length&&!cards.length&&!tasks.length){
        drop.innerHTML='<div style="padding:10px;font-size:11px;color:var(--t3)">Sonuç bulunamadı</div>';
        drop.style.display='block';return;
      }
      if(briefs.length){
        html+=`<div style="padding:4px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Brief</div>`;
        html+=briefs.slice(0,4).map(b=>`<div class="sr-item" onclick="nav('${b.firmId}','${b.id}','brief');closeSR()">${b.firm?.name||''} › ${b.month} ${b.year}</div>`).join('');
      }
      if(cards.length){
        html+=`<div style="padding:4px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Kart</div>`;
        html+=cards.slice(0,4).map(c=>`<div class="sr-item" onclick="nav('${c.brief?.firmId||''}','${c.briefId}','${c.which==='IG'?'mb':'mb-kamp'}');closeSR()">${c.label}</div>`).join('');
      }
      if(tasks.length){
        html+=`<div style="padding:4px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Görev</div>`;
        html+=tasks.slice(0,4).map(t=>`<div class="sr-item" onclick="nav('${t.brief?.firmId||''}','${t.briefId}','tasks');closeSR()">${t.desc||t.cardRef}</div>`).join('');
      }
      drop.innerHTML=html;drop.style.display='block';
    }catch{if(drop)drop.style.display='none';}
  },300);
}
function closeSR(){
  const drop=document.getElementById('search-drop');
  const inp=document.querySelector('.tb-search input');
  if(drop)drop.style.display='none';
  if(inp)inp.value='';
}
document.addEventListener('click',e=>{if(!e.target.closest('.tb-search'))closeSR();});

// ── WEBSOCKET ─────────────────────────────────────────────
function initWS(){
  if(!_token)return;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}?token=${_token}`);
  ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.notif||m.title)toast((m.notif||m).title||'Bildirim','amb');}catch{}};
  ws.onclose=()=>setTimeout(initWS,5000);
  ws.onerror=()=>ws.close();
}

// ── INIT APP ──────────────────────────────────────────────
async function initApp(){
  try{
    if(!_me)_me=await api('/api/auth/me');
  }catch{
    showLogin();return;
  }

  document.getElementById('app').style.display='flex';
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('reg-wrap').style.display='none';

  // Topbar
  const av=document.getElementById('tb-av');
  const nm=document.getElementById('tb-nm');
  const rl=document.getElementById('tb-role');
  if(av)av.textContent=(_me.name||_me.email||'?')[0].toUpperCase();
  if(nm)nm.textContent=_me.name||_me.email||'—';
  if(rl){
    const rlMap={ADMIN:'Admin',EDITOR:'Editör',PROD:'Prodüksiyon',CLIENT:'Müşteri'};
    rl.textContent=rlMap[_me.role]||_me.role;
  }

  // CLIENT role: show portal link
  const custLnk=document.getElementById('si-cust');
  if(custLnk)custLnk.style.display=_me.role==='CLIENT'?'flex':'none';
  // Non-admin: hide firm add button
  const addFirm=document.getElementById('sb-add-firm');
  if(addFirm)addFirm.style.display=_me.role==='ADMIN'?'':'none';

  try{
    await Promise.all([loadMembers(),loadFirms()]);
    await Promise.all(firms.map(f=>loadBriefs(f.id)));
  }catch(e){console.error('Load error',e);}

  renderSB();

  if(_me.role==='CLIENT'){
    // Find first firm the client belongs to
    const myFirm=firms.find(f=>(f.members||[]).some(m=>m.userId===_me.id));
    const myBrief=myFirm?.briefs?.[0];
    if(myFirm&&myBrief){nav(myFirm.id,myBrief.id,'cust');}
    else go('home');
  }else{
    go('home');
  }

  initWS();
}

// Enter key support for login
document.getElementById('li-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('li-email')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('li-pass')?.focus();});

// ── BOOTSTRAP ─────────────────────────────────────────────
if(_token){
  initApp();
}else{
  showLogin();
}
</script>
